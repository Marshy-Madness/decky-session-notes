<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1d2129">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icon.svg">
<title>Desk of Madness</title>
<style>
  :root { color-scheme: dark; --bg: #14171c; --panel: #1d2129; --line: #2a2f38; --chip: #2c323d; --accent: #1a9fff; --danger: #e5484d; }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: system-ui, sans-serif; background: var(--bg); color: #e6e9ee; }
  button, input, select, textarea { font: inherit; color: inherit; }
  button { background: #2b313c; border: 1px solid #3a414e; border-radius: 6px; padding: 6px 12px; cursor: pointer; }
  button:hover { background: #343b48; } button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button.danger { color: var(--danger); } button.icon { padding: 2px 8px; }
  input, select, textarea { background: #262b35; border: 1px solid #39404c; border-radius: 6px; padding: 6px 10px; }
  textarea { width: 100%; resize: vertical; line-height: 1.45; }
  header { padding: 12px 20px; background: var(--panel); display: flex; gap: 12px; align-items: center; position: sticky; top: 0; z-index: 2; }
  header h1 { font-size: 18px; margin: 0; flex: 1; }
  main { display: grid; grid-template-columns: 280px 1fr; min-height: calc(100vh - 56px); }
  nav { border-right: 1px solid var(--line); overflow-y: auto; }
  nav button { display: block; width: 100%; text-align: left; padding: 10px 16px; background: none; border: 0; border-radius: 0; border-bottom: 1px solid #22262e; }
  nav button.active, nav button:hover { background: #262b35; }
  small, .meta { opacity: .65; font-size: 12px; }
  section#content { padding: 20px; max-width: 1100px; }
  .toolbar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin: 12px 0; }
  .card { background: var(--panel); border-radius: 8px; padding: 12px 14px; margin-bottom: 10px; display: flex; gap: 12px; cursor: pointer; }
  .card:hover { background: #232833; } .card .text { flex: 1; min-width: 0; }
  .card h3 { margin: 0; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .card .first { opacity: .75; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 2px; }
  .card img { width: 140px; height: 79px; object-fit: cover; border-radius: 6px; }
  .chip { display: inline-block; font-size: 12px; background: var(--chip); border-radius: 8px; padding: 1px 7px; margin: 4px 4px 0 0; }
  .box { background: #1e2a38; border-radius: 8px; padding: 12px 14px; margin-bottom: 12px; }
  .counter { display: flex; align-items: center; gap: 8px; padding: 4px 0; }
  .viewswitch { margin: 10px 0 12px; } .viewswitch button { flex: 1 1 0; max-width: 180px; }
  .desk { columns: 2 340px; column-gap: 12px; } .tome { break-inside: avoid; padding: 8px 12px; }
  .thead { display: flex; align-items: center; gap: 6px; } .tfold { flex: 1; text-align: left; background: none; border: 0; padding: 4px 0; font-weight: bold; text-transform: uppercase; letter-spacing: .05em; font-size: 13px; color: inherit; }
  .tbody { margin-top: 4px; } .tline { display: flex; gap: 10px; padding: 7px 8px; border-radius: 6px; background: rgba(255,255,255,.04); margin-bottom: 4px; cursor: pointer; }
  .tline .ti { width: 20px; text-align: center; flex: 0 0 auto; } .tl { font-size: 11px; font-weight: bold; text-transform: uppercase; letter-spacing: .06em; opacity: .6; }
  .tbody .kv { display: grid; grid-template-columns: auto 1fr; gap: 3px 14px; } button.small { padding: 3px 10px; font-size: 12px; }
  .tomeadm { display: flex; align-items: center; gap: 6px; padding: 3px 0; border-bottom: 1px solid var(--line); }
  .tome .counter { flex-wrap: nowrap; } .tome .counter .name { flex: 1 1 auto; min-width: 0; }
  @media (max-width: 700px) { .deskbtn span { display: none; } .deskbtn { padding: 6px 10px; } .gamehead h2 { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; } }
  .counter .n { min-width: 40px; text-align: center; font-size: 18px; font-weight: bold; }
  .counter .name { flex: 1; } .defeated { opacity: .6; }
  .spoiler { filter: blur(5px); }
  dialog { background: var(--panel); color: inherit; border: 1px solid var(--line); border-radius: 10px; width: min(860px, 95vw); max-height: 92vh; padding: 20px; }
  dialog::backdrop { background: rgba(0,0,0,.6); }
  dialog label { display: block; font-size: 12px; opacity: .75; margin: 12px 0 4px; }
  .row { display: flex; gap: 10px; } .row > * { flex: 1; }
  .shots { display: flex; gap: 10px; flex-wrap: wrap; } .shot { width: 180px; font-size: 11px; }
  .shot img { width: 180px; height: 101px; object-fit: cover; border-radius: 6px; display: block; }
  .check { display: flex; gap: 8px; align-items: center; padding: 3px 0; } .check input[type=text] { flex: 1; }
  #login { max-width: 340px; margin: 18vh auto; background: var(--panel); padding: 24px; border-radius: 10px; }
  #login input { width: 100%; margin: 6px 0; } .err { color: var(--danger); font-size: 13px; min-height: 18px; }
  .ok { color: #46c37b; font-size: 13px; } #login a { color: #66c0f4; }
  .badge { background: var(--danger); color: #fff; border-radius: 9px; font-size: 11px; padding: 0 6px; margin-left: 4px; }
  nav .gicon, .gicon { width: 32px; height: 32px; border-radius: 4px; object-fit: cover; background: #2c323d; flex: none; }
  nav button.game { display: flex; gap: 10px; align-items: center; } nav button.game .t { flex: 1; min-width: 0; }
  .gicon.ph { display: inline-flex; align-items: center; justify-content: center; font-size: 16px; }
  .gamehead { display: flex; gap: 12px; align-items: center; } .gamehead .gicon { width: 44px; height: 44px; }
  .lookup { display: flex; gap: 12px; align-items: center; min-height: 60px; background: #171a20; border-radius: 8px; padding: 8px 12px; margin: 8px 0; }
  .lookup img { width: 120px; height: 56px; object-fit: cover; border-radius: 4px; }
  .hidden { display: none !important; }
  .steam-btn { display: block; text-align: center; background: #171a21; border: 1px solid #66c0f4; color: #66c0f4; padding: 12px; border-radius: 8px; text-decoration: none; font-weight: 600; margin: 14px 0 6px; }
  .steam-btn:hover { background: #1b2838; }
  #account { display: flex; align-items: center; gap: 8px; } #account img { width: 24px; height: 24px; border-radius: 4px; }
  .person { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--line); }
  .person img, .person .ph { width: 32px; height: 32px; border-radius: 4px; background: #2c323d; }
  .person .who { flex: 1; min-width: 0; }
  .code { font-size: 32px; letter-spacing: 6px; font-weight: 700; text-align: center; padding: 16px; background: #171a20; border-radius: 10px; margin: 10px 0; }
  .crop-wrap { position: relative; display: inline-block; max-width: 100%; touch-action: none; user-select: none; }
  .crop-wrap img { display: block; max-width: 100%; max-height: 60vh; }
  .crop-box { position: absolute; outline: 2px solid var(--accent); box-shadow: 0 0 0 9999px rgba(0,0,0,.55); }
  .version { background: #262b35; border-radius: 8px; padding: 10px 12px; margin-bottom: 8px; cursor: pointer; display: flex; gap: 10px; align-items: center; }
  .version:hover { background: #2e3440; } .version .text { flex: 1; min-width: 0; }
  .preview { background: #171a20; border-radius: 8px; padding: 12px; white-space: pre-wrap; max-height: 45vh; overflow-y: auto; margin: 10px 0; }
  button.recording { background: var(--danger); border-color: var(--danger); color: #fff; }
  .labelrow { display: flex; align-items: flex-end; gap: 8px; } .labelrow label { flex: 1; } .labelrow button { margin-bottom: 4px; }
  .said { font-size: 13px; background: #171a20; border-radius: 6px; padding: 6px 10px; margin: 0 0 8px; white-space: pre-wrap; }
  .said .meta { margin-right: 6px; }
  .saving { position: fixed; bottom: 16px; right: 16px; background: var(--panel); padding: 8px 14px; border-radius: 8px; border: 1px solid var(--line); }
  #gamePicker, .mobile-only, .fab { display: none; }
  .card .when { font-size: 12px; opacity: .6; margin-top: 4px; }
  /* Save/Cancel stay in view at the bottom of long dialogs. */
  dialog .actions { position: sticky; bottom: -20px; z-index: 1; background: var(--panel); border-top: 1px solid var(--line); margin: 18px -20px -20px; padding: 12px 20px; }
  .counter-add summary { cursor: pointer; font-size: 13px; opacity: .8; padding: 8px 0 2px; }
  .dlghead { display: flex; align-items: center; gap: 10px; } .dlghead .person { flex: 1; }
  /* ---- admin ---- */
  dialog.wide { width: min(1100px, 96vw); height: min(820px, 92vh); display: none; flex-direction: column; }
  dialog.wide[open] { display: flex; }
  .admin { display: grid; grid-template-columns: 210px 1fr; gap: 18px; flex: 1; min-height: 0; margin-top: 12px; }
  .aside { overflow-y: auto; border-right: 1px solid var(--line); padding-right: 10px; }
  .aside .agroup { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; opacity: .55; margin: 14px 8px 4px; }
  .aside .agroup:first-child { margin-top: 0; }
  .aside button { display: flex; align-items: center; gap: 6px; width: 100%; text-align: left; background: none; border: 0; padding: 8px 10px; }
  .aside button:hover { background: #262b35; } .aside button.active { background: #1e3a55; color: #fff; }
  .aside .badge { margin-left: auto; }
  .apage { overflow-y: auto; padding-right: 6px; } .apage h3 { margin-top: 0; } .apage h4 { margin: 18px 0 6px; font-size: 14px; opacity: .85; }
  .stats { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 8px; }
  .stat { background: #171a20; border-radius: 8px; padding: 10px 12px; } .stat b { display: block; font-size: 22px; } .stat span { font-size: 12px; opacity: .65; }
  .stat.warn b { color: #f5a524; } .warnbox { background: #3a2c12; } .warnbox a { color: #f5c46b; }
  .logrow { display: grid; grid-template-columns: 170px 1fr; gap: 10px; padding: 6px 0; border-bottom: 1px solid var(--line); font-size: 14px; }
  .ucard { background: #171a20; border-radius: 8px; margin-bottom: 8px; }
  .ucard summary { display: flex; gap: 10px; align-items: center; padding: 10px 12px; cursor: pointer; list-style: none; }
  .ucard summary::-webkit-details-marker { display: none; }
  .ucard summary img, .ucard summary .ph { width: 36px; height: 36px; border-radius: 4px; background: #2c323d; flex: none; }
  .ucard summary .who { flex: 1; min-width: 0; } .ucard[open] summary { border-bottom: 1px solid var(--line); }
  .uactions { padding: 4px 12px 10px; } .uactions .toolbar { margin: 8px 0; } .uactions .toolbar > .meta:first-child { width: 70px; }
  label.inline, label.radio { display: flex; gap: 8px; align-items: center; opacity: 1; margin: 0; font-size: 14px; }
  label.radio { align-items: flex-start; background: #171a20; border-radius: 8px; padding: 10px 12px; margin: 8px 0; cursor: pointer; }
  label.radio input { margin-top: 3px; }
  .kv { display: grid; grid-template-columns: 170px 1fr; gap: 6px 12px; font-size: 14px; } .kv span { opacity: .65; } .kv b { font-weight: 500; word-break: break-all; }
  #announce { background: #1e3a55; padding: 10px 20px; display: flex; gap: 12px; align-items: center; }
  #announce span { flex: 1; white-space: pre-wrap; }
  /* ---- phones ---- */
  @media (max-width: 760px) {
    .hide-sm { display: none; }
    header { flex-wrap: wrap; padding: 10px 12px; padding-top: max(10px, env(safe-area-inset-top)); gap: 8px; }
    header h1 { font-size: 18px; }
    #search { flex: 1 1 100%; order: 4; }
    body:not(.ingame) #search { display: none; }
    .mobile-only { display: inline-block; }
    main { grid-template-columns: minmax(0, 1fr); }
    /* Phones: the game list is the home screen; opening a game swaps it for the notes. */
    nav { display: none; border: 0; }
    body:not(.ingame) nav { display: block; }
    body:not(.ingame) section#content { display: none; }
    nav button { padding: 12px 14px; font-size: 16px; } nav button small { font-size: 13px; }
    nav .gicon { width: 46px; height: 46px; border-radius: 6px; }
    section#content { padding: 12px; padding-bottom: max(96px, env(safe-area-inset-bottom)); }
    button, select, input:not([type=checkbox]) { min-height: 44px; }
    button.icon { min-width: 44px; }
    input, select, textarea { font-size: 16px; } /* stops iOS zooming into fields */
    .gamehead h2 { font-size: 20px; } .gamehead .gicon { width: 40px; height: 40px; }
    .card { padding: 12px; } .card img { width: 96px; height: 54px; align-self: center; }
    .card h3 { font-size: 16px; } .card .first { font-size: 14px; }
    .counter { flex-wrap: wrap; } .counter .name { flex: 1 1 100%; }
    .toolbar > select, .toolbar > input { flex: 1 1 40%; min-width: 0; }
    #newNote { display: none; }
    .fab { display: flex; align-items: center; gap: 6px; position: fixed; right: 16px; bottom: max(16px, env(safe-area-inset-bottom)); z-index: 3;
      background: var(--accent); color: #fff; border: 0; border-radius: 28px; padding: 0 22px; min-height: 56px; font-size: 16px; font-weight: 600; box-shadow: 0 6px 18px rgba(0,0,0,.45); }
    body:not(.ingame) .fab { display: none; }
    dialog { width: 100vw; max-width: 100vw; height: 100dvh; max-height: 100dvh; margin: 0; border-radius: 0; border: 0;
      padding: 16px; padding-top: max(16px, env(safe-area-inset-top)); padding-bottom: max(16px, env(safe-area-inset-bottom)); }
    dialog .actions { bottom: calc(-1 * max(16px, env(safe-area-inset-bottom))); margin: 18px -16px calc(-1 * max(16px, env(safe-area-inset-bottom)));
      padding: 10px 16px max(10px, env(safe-area-inset-bottom)); display: flex; gap: 10px; }
    dialog .actions > button { flex: 1; }
    dialog .actions > span[style*="flex:1"] { display: none; }
    .row { flex-direction: column; gap: 0; }
    .shot, .shot img { width: calc(50vw - 24px); } .shot img { height: calc((50vw - 24px) * 0.5625); }
    audio { max-width: 100%; }
    .saving { left: 12px; right: 12px; text-align: center; }
    dialog.wide { width: 100vw; height: 100dvh; }
    .admin { grid-template-columns: minmax(0, 1fr); grid-template-rows: auto 1fr; gap: 10px; }
    .aside { display: flex; overflow-x: auto; border: 0; border-bottom: 1px solid var(--line); padding: 0 0 8px; gap: 4px; }
    .aside .agroup { display: none; }
    .aside button { width: auto; white-space: nowrap; flex: none; border-radius: 18px; background: #262b35; }
    .logrow, .kv { grid-template-columns: minmax(0, 1fr); gap: 2px; } .kv b { margin-bottom: 8px; }
    .uactions .toolbar > .meta:first-child { width: 100%; }
  }
</style>
</head>
<body>
<form id="login" class="hidden">
  <h2 style="margin-top:0">📝 Desk of Madness</h2>
  <a href="/auth/steam" class="steam-btn">Sign in with Steam</a>
  <div class="err" id="loginErr"></div>
  <div class="ok" id="loginOk"></div>
  <div class="meta" style="text-align:center;margin:10px 0 0">or with email</div>
  <input id="signupName" class="hidden" placeholder="Your name" autocomplete="nickname" maxlength="60">
  <input id="email" type="email" placeholder="Email" autocomplete="username">
  <input id="password" type="password" placeholder="Password" autocomplete="current-password">
  <input id="password2" class="hidden" type="password" placeholder="Retype password" autocomplete="new-password">
  <button class="primary" id="loginBtn" style="width:100%">Log in</button>
  <p class="meta hidden" id="signupNote"></p>
  <p class="meta" style="text-align:center"><a href="#" id="toggleSignup">New here? Create an account</a></p>
  <p class="meta" id="ownerHint">Server owner: leave the email empty and use the owner password.</p>
</form>

<div id="app" class="hidden">
  <header>
    <h1>📝 Desk of Madness</h1>
    <select id="gamePicker" aria-label="Game"></select>
    <input id="search" placeholder="Search notes…">
    <a id="bookstoreLink" class="hidden" target="_blank" rel="noopener"><button>🏭 Madness Workshop</button></a>
    <a id="getApp" class="hidden" href="/download/android"><button>📱 Android app</button></a>
    <button id="changeServer" class="hidden">Server</button>
    <button id="adminBtn" class="hidden">🛡<span class="hide-sm"> Admin</span></button>
    <button id="account">Account</button>
  </header>
  <div id="announce" class="hidden"><span>📣 <span id="announceText"></span></span><button id="announceClose" class="icon" aria-label="Hide">✕</button></div>
  <main><nav id="games"></nav><section id="content"><p class="meta">Pick a game.</p></section></main>
  <button class="fab" id="fabNote">＋ New note</button>
</div>

<dialog id="editor"></dialog>
<dialog id="panel"></dialog>
<dialog id="admin" class="wide"></dialog>
<div id="saving" class="saving hidden">Saving…</div>

<script>
window.DeskApp = window.DeskApp || window.SessionNotesApp; // the Android app's bridge (SessionNotesApp in apps before the rename)

const $ = (s, el = document) => el.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
const date = (ms) => (ms ? new Date(ms).toLocaleString(undefined, { dateStyle: "medium", timeStyle: "short" }) : "—");
const day = (ms) => (ms ? new Date(ms).toLocaleDateString(undefined, { dateStyle: "medium" }) : "—");
const uid = () => (crypto.randomUUID ? crypto.randomUUID() : "xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx".replace(/[xy]/g, (c) => { const r = (Math.random() * 16) | 0; return (c === "x" ? r : (r & 3) | 8).toString(16); }));
const mediaUrl = (appId, file) => `/api/media/${encodeURIComponent(appId)}/${encodeURIComponent(file)}`;

async function api(path, opts = {}) {
  const r = await fetch(path, { ...opts, headers: { "X-Requested-With": "desk-of-madness", ...(opts.json ? { "Content-Type": "application/json" } : {}), ...(opts.headers || {}) }, body: opts.json ? JSON.stringify(opts.json) : opts.body });
  if (r.status === 401) { showLogin(); throw new Error("unauthorized"); }
  const data = await r.json().catch(() => null);
  if (!r.ok) throw new Error(data?.error || r.statusText);
  return data;
}

// ---------- login ----------
function showLogin() { $("#app").classList.add("hidden"); $("#login").classList.remove("hidden"); $("#email").focus(); }
let signingUp = false, signupMode = "approval";
function setSignup(on) {
  signingUp = on;
  $("#signupName").classList.toggle("hidden", !on);
  $("#password2").classList.toggle("hidden", !on);
  $("#ownerHint").classList.toggle("hidden", on);
  $("#signupNote").classList.toggle("hidden", !on);
  $("#signupNote").textContent = signupMode === "open" ? "" : "The server owner approves new accounts before you can sign in.";
  $("#loginBtn").textContent = on ? "Create account" : "Log in";
  $("#toggleSignup").textContent = on ? "Already have an account? Log in" : "New here? Create an account";
  $("#password").autocomplete = on ? "new-password" : "current-password";
  $("#password").placeholder = on ? "Password (8+ characters)" : "Password";
}
$("#toggleSignup").onclick = (e) => { e.preventDefault(); $("#loginErr").textContent = ""; setSignup(!signingUp); };
$("#login").onsubmit = async (e) => {
  e.preventDefault();
  $("#loginErr").textContent = $("#loginOk").textContent = "";
  try {
    if (signingUp && $("#password").value !== $("#password2").value) throw new Error("The passwords don't match. Type the same password in both boxes.");
    const body = signingUp ? { name: $("#signupName").value, email: $("#email").value, password: $("#password").value }
      : { email: $("#email").value, password: $("#password").value };
    const r = await fetch(signingUp ? "/api/signup" : "/api/login", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
    const data = await r.json();
    if (!r.ok) throw new Error(data.error);
    $("#password").value = $("#password2").value = "";
    if (data.pending) { setSignup(false); $("#loginOk").textContent = "Thanks! You can log in once the server owner approves your account."; return; }
    start();
  } catch (err) { $("#loginErr").textContent = err.message; }
};
// The Android app's "change server" lives in the Account dialog, and under the login form.
if (window.DeskApp) {
  $("#login").insertAdjacentHTML("beforeend", '<p class="meta" style="text-align:center"><a href="#" id="loginServer">Use a different server</a></p>');
  $("#loginServer").onclick = (e) => { e.preventDefault(); window.DeskApp.changeServer(); };
}
const loginError = new URLSearchParams(location.search).get("error");
if (loginError) { $(/approve/.test(loginError) ? "#loginOk" : "#loginErr").textContent = loginError; history.replaceState(null, "", "/"); }
// "Save to my notes" from the Madness Workshop links here as /?import=workshop:<entryId> (bookstore: from older links). Kept across a sign-in.
const importParam = new URLSearchParams(location.search).get("import");
const importMatch = importParam?.match(/^(?:workshop|bookstore):(.+)$/);
if (importMatch) { sessionStorage.setItem("sn-import", importMatch[1]); history.replaceState(null, "", "/"); }

// ---------- state ----------
let games = [], game = null, folderFilter = "all", kindFilter = "all", sortMode = localStorage.getItem("sn-sort") || "edited";
let me = null, sharedWithMe = [], speechOn = false, pendingUsers = 0;
const KINDS = [["note", "📝", "Note"], ["guide", "📘", "Guide"], ["tip", "💡", "Tip"], ["walkthrough", "🧭", "Walkthrough"],
  ["boss", "⚔️", "Boss strategy"], ["build", "🛡️", "Build / loadout"], ["collectibles", "🗺️", "Collectibles / map"],
  ["secret", "🔮", "Secret / easter egg"], ["settings", "⚙️", "Deck settings"], ["achievement", "🏆", "Achievement guide"]];
const GUIDE_KINDS = ["guide", "walkthrough", "achievement"];
const kindOf = (k) => KINDS.find((x) => x[0] === (k || "note")) || KINDS[0];

function paintAccount() {
  $("#account").innerHTML = `${me.avatar ? `<img src="${esc(me.avatar)}">` : "👤"}<span class="hide-sm">${esc(me.name)}</span>`;
  $("#adminBtn").innerHTML = `🛡<span class="hide-sm"> Admin</span>${pendingUsers ? `<span class="badge" title="People waiting for approval">${pendingUsers}</span>` : ""}`;
}

async function start() {
  const info = await (await fetch("/api/me")).json();
  $("#toggleSignup").classList.toggle("hidden", info.emailSignups === false);
  signupMode = info.signups || "approval";
  if (!info.loggedIn) return showLogin();
  me = info.user;
  me.admin = !!info.admin;
  $("#adminBtn").classList.toggle("hidden", !me.admin);
  $("#adminBtn").onclick = () => adminDialog();
  paintAnnouncement(info.announcement);
  speechOn = !!info.speech;
  pendingUsers = info.pendingUsers || 0;
  paintAccount();
  $("#account").onclick = accountDialog;
  if (info.androidApp && !window.DeskApp && /Android/i.test(navigator.userAgent)) $("#getApp").classList.remove("hidden");
  workshopUrl = info.bookstoreUrl || "";
  deskDefaults = info.deskDefaults || null;
  if (info.bookstoreUrl && !window.DeskApp?.openBookstore) { $("#bookstoreLink").href = info.bookstoreUrl; $("#bookstoreLink").classList.remove("hidden"); }
  $("#login").classList.add("hidden");
  $("#app").classList.remove("hidden");
  await loadGames();
  const last = localStorage.getItem("sn-game");
  if (last && games.some((g) => g.appId === last)) await openGame(last);
  else if (games.length) await openGame(games[0].appId); // most recently played
  checkPwaShare();
  await checkBookstoreImport();
  window.DeskApp?.ready?.(); // native Android app: deliver any pending share
}

async function loadGames() {
  const [own, shared] = await Promise.all([api("/api/games"), api("/api/shared").catch(() => [])]);
  sharedWithMe = shared;
  games = own;
  for (const s of shared) {
    const g = games.find((x) => x.appId === s.appId);
    if (g) g.sharedCount = (g.sharedCount || 0) + 1;
    else games.push({ appId: s.appId, name: s.gameName || s.appId, noteCount: 0, sharedCount: 1, lastLaunched: 0 });
  }
  games.sort((a, b) => (b.lastLaunched ?? 0) - (a.lastLaunched ?? 0));
  $("#games").innerHTML = '<button id="addGame" class="game"><span class="gicon ph">＋</span><span class="t">Add a game</span></button>' +
    (games.map((g) => `<button data-id="${esc(g.appId)}" class="game ${g.appId === game?.appId ? "active" : ""}">${gameIcon(g)}<span class="t">${esc(g.name)}<br><small>${g.noteCount} notes${g.sharedCount ? ` · 👥 ${g.sharedCount} shared` : ""} · last played ${day(g.lastLaunched)}</small></span></button>`).join("") || '<p class="meta" style="padding:16px">Nothing synced yet. Turn on sync in the Deck plugin, or add a game above.</p>');
  $("#games").querySelectorAll("button[data-id]").forEach((b) => (b.onclick = () => openGame(b.dataset.id)));
  $("#addGame").onclick = addGameDialog;
  $("#gamePicker").innerHTML = (game ? "" : '<option value="">Pick a game…</option>') +
    games.map((g) => `<option value="${esc(g.appId)}">${esc(g.name)} (${g.noteCount})</option>`).join("") + '<option value="+">＋ Add a game…</option>';
  if (game) $("#gamePicker").value = game.appId;
}

async function openGame(appId) {
  localStorage.setItem("sn-game", appId);
  folderFilter = "all";
  try { game = (await api(`/api/games/${encodeURIComponent(appId)}`)).game; }
  catch {  // a game you only have shared notes for
    const g = games.find((x) => x.appId === appId);
    game = { appId, name: g?.name || appId, notes: [], folders: [], counters: [], sessions: [] };
  }
  document.body.classList.add("ingame");
  $("#games").querySelectorAll("button").forEach((b) => b.classList.toggle("active", b.dataset.id === appId));
  if (!$("#gamePicker").querySelector(`option[value="${CSS.escape(appId)}"]`)) loadGames(); else $("#gamePicker").value = appId;
  render();
}

/** Phones: back from a game to the game list. */
function closeGame() {
  document.body.classList.remove("ingame");
  $("#search").value = "";
  window.scrollTo(0, 0);
}

/** Send the whole game; the server merges it (newest edit wins) and returns the result. */
async function save() {
  $("#saving").classList.remove("hidden");
  try {
    game = (await api(`/api/sync/${encodeURIComponent(game.appId)}`, { method: "POST", json: game })).game;
    render();
    loadGames();
  } catch (err) { alert("Couldn't save: " + err.message); }
  finally { $("#saving").classList.add("hidden"); }
}

const tombstone = (id) => ((game.deleted ??= {})[id] = Date.now());
const folderPath = (id) => { const p = []; let f = game.folders.find((x) => x.id === id); while (f) { p.unshift(f.name); f = game.folders.find((x) => x.id === f.parentId); } return p.join(" / "); };
const transcriptsOf = (n) => (n.recordings || []).map((r) => r.transcript).filter(Boolean).join(" ");
const firstLine = (body) => (body || "").split("\n").map((l) => l.replace(/\[img:\d+\]/g, "").trim()).find(Boolean) || "";

// ---------- game view ----------
let workshopUrl = "", deskDefaults = null;
let gameView = localStorage.getItem("dom-view") || "desk";
const viewSwitch = () => `<div class="toolbar viewswitch"><button data-view="desk" class="${gameView === "desk" ? "primary" : ""}">🗂 Desk</button><button data-view="notes" class="${gameView === "notes" ? "primary" : ""}">📝 Notes</button></div>`;
function wireViewSwitch() {
  $("#content").querySelectorAll("[data-view]").forEach((b) => (b.onclick = () => { gameView = b.dataset.view; localStorage.setItem("dom-view", gameView); render(); }));
}

function render() {
  if (!game) return;

  const sharedHere = sharedWithMe.filter((s) => s.appId === game.appId);
  const notes = (folderFilter === "shared" ? [] : game.notes)

    .filter((n) => kindFilter === "all" || (n.kind || "note") === kindFilter)
    .filter((n) => !q || (n.title + "\n" + n.body + "\n" + (n.tags || []).join(" ") + "\n" + transcriptsOf(n)).toLowerCase().includes(q))
    .sort((a, b) => (b.pinned ? 1 : 0) - (a.pinned ? 1 : 0) || (sorters[sortMode] || sorters.edited)(a, b));
  const lo = game.leftOff?.text ? game.leftOff : null;
  const counters = [...game.counters].sort((a, b) => (a.defeated ? 1 : 0) - (b.defeated ? 1 : 0) || a.createdAt - b.createdAt);
  const icon = { death: "💀", boss: "⚔️", custom: "#" };

  $("#content").innerHTML = `
    <div class="gamehead"><button class="mobile-only" id="backToGames" aria-label="All games">‹ Games</button>${gameIcon(games.find((g) => g.appId === game.appId) || game)}<h2 style="margin:0;flex:1">${esc(game.name)}</h2>
      <button id="gameSettings" title="Rename, or link more app IDs to this game">⚙ Game</button></div>
    <div class="meta">Launched ${game.launchCount ?? 0}× · ${Math.round((game.playtimeSeconds ?? 0) / 60)} min played · last played ${date(game.lastLaunched)}</div>
    ${viewSwitch()}

    <div class="box" style="margin-top:14px">
      <b>📍 Where I left off</b> ${lo ? `<span class="meta">· ${date(lo.updatedAt)}</span>` : ""}

      <div class="toolbar" style="margin:6px 0 0"><button id="saveLeftOff" class="primary">Save pin</button>${lo ? '<button id="clearLeftOff">Clear</button>' : ""}${micButton("leftOff")}</div>
    </div>

    <div class="box">
      <b>Counters</b>
      ${counters.map((c) => `<div class="counter ${c.defeated ? "defeated" : ""}" data-id="${esc(c.id)}">
          <span>${icon[c.kind] || "#"}</span><span class="name">${esc(c.name)} ${c.defeated ? '<span class="chip">✓ defeated</span>' : ""} ${c.sessionCount ? `<small>+${c.sessionCount} this session</small>` : ""}</span>
          <button class="icon" data-act="dec">−</button><span class="n">${c.count}</span><button class="icon" data-act="inc">+</button>
          ${c.kind === "boss" ? `<button class="icon" data-act="defeat">${c.defeated ? "Undo defeat" : "Defeated"}</button>` : ""}
          <button class="icon" data-act="rename">Rename</button><button class="icon danger" data-act="del">✕</button></div>`).join("") || '<div class="meta">Track deaths or boss attempts.</div>'}
      <details class="counter-add"><summary>＋ Add a counter</summary><div class="toolbar" style="margin:8px 0 0">
        <select id="counterKind"><option value="death">💀 Death counter</option><option value="boss">⚔️ Boss attempts</option><option value="custom"># Custom</option></select>
        <input id="counterName" placeholder="Name (e.g. Malenia)"><button id="addCounter">Add counter</button>
      </div></details>
    </div>

    <div class="toolbar">
      <button class="primary" id="newNote">+ New note</button>
      <button id="newFolder">+ New folder</button>
      <select id="folderFilter"><option value="all">All folders</option><option value="none">No folder</option>
        <option value="guides">📘 Guides</option>${sharedHere.length ? `<option value="shared">👥 Shared Notes (${sharedHere.length})</option>` : ""}
        ${game.folders.map((f) => `<option value="${esc(f.id)}">📁 ${esc(folderPath(f.id))}</option>`).join("")}</select>
      <select id="kindFilter"><option value="all">All types</option>${KINDS.map((k) => `<option value="${k[0]}">${k[1]} ${k[2]}</option>`).join("")}</select>
      ${!["all", "none", "guides", "shared"].includes(folderFilter) ? '<button id="renameFolder">Rename folder</button><button id="deleteFolder" class="danger">Delete folder</button>' : ""}
      <span style="flex:1"></span>
      <button id="showDeleted">🗑 Recently deleted</button>
      <select id="sort"><option value="edited">Sort: Last Edited</option><option value="created">Sort: Created</option><option value="alpha">Sort: Alphabetical</option></select>
    </div>

    ${notes.map((n) => {
      const shot = n.screenshots?.[0];
      const done = (n.checklist || []).filter((c) => c.done).length;
      const k = kindOf(n.kind);
      const chips = [n.kind && n.kind !== "note" ? `${k[1]} ${k[2]}` : "", n.source ? `${n.source.type === "bookstore" ? "📚" : "👥"} from ${n.source.author}` : "", n.launchNumber ? `Launch #${n.launchNumber}` : "", n.folderId ? `📁 ${folderPath(n.folderId)}` : "",
        n.checklist?.length ? `☑ ${done}/${n.checklist.length}` : "", n.recordings?.length ? `🎙 ${n.recordings.length}` : "", ...(n.tags || []).map((t) => "#" + t)].filter(Boolean);
      return `<div class="card" data-id="${esc(n.id)}"><div class="text">
          <h3>${n.pinned ? "📌 " : ""}${n.spoiler ? "🙈 " : ""}${esc(n.title)}</h3>
          <div class="first ${n.spoiler ? "spoiler" : ""}">${esc(firstLine(n.body) || (transcriptsOf(n) ? "🎙 " + transcriptsOf(n) : "")) || "&nbsp;"}</div>
          ${chips.map((c) => `<span class="chip">${esc(c)}</span>`).join("")}

          ${shot ? `<img class="${n.spoiler ? "spoiler" : ""}" loading="lazy" src="${mediaUrl(game.appId, shot.thumb || shot.file)}">` : ""}</div>`;
    }).join("")}
    ${folderFilter === "shared" ? sharedHere.map((s) => `<div class="card shared" data-share="${esc(s.shareId)}"><div class="text">
        <h3>${s.note.spoiler ? "🙈 " : ""}${esc(s.note.title)}</h3><div class="first ${s.note.spoiler ? "spoiler" : ""}">${esc(firstLine(s.note.body)) || "&nbsp;"}</div>
        <span class="chip" style="background:#1f5c45">👥 ${esc(s.fromName)}</span><span class="chip">Edited ${date(s.note.updatedAt)}</span></div>
        ${s.note.screenshots?.[0] ? `<img loading="lazy" src="/api/shared/media/${esc(s.shareId)}/${encodeURIComponent(s.note.screenshots[0].thumb || s.note.screenshots[0].file)}">` : ""}</div>`).join("") : ""}

  wireViewSwitch();
  $("#folderFilter").value = folderFilter;
  $("#kindFilter").value = kindFilter;
  $("#kindFilter").onchange = (e) => { kindFilter = e.target.value; render(); };
  $("#sort").value = sortMode;
  $("#folderFilter").onchange = (e) => { folderFilter = e.target.value; render(); };
  $("#sort").onchange = (e) => { sortMode = e.target.value; localStorage.setItem("sn-sort", sortMode); render(); };
  wireDictation($("#content"));
  $("#saveLeftOff").onclick = () => { game.leftOff = { text: $("#leftOff").value.trim(), updatedAt: Date.now(), launchNumber: null }; save(); };
  if ($("#clearLeftOff")) $("#clearLeftOff").onclick = () => { game.leftOff = { text: "", updatedAt: Date.now(), launchNumber: null }; save(); };
  $("#addCounter").onclick = () => {
    const kind = $("#counterKind").value;
    const name = $("#counterName").value.trim() || { death: "Deaths", boss: "Boss", custom: "Counter" }[kind];

    if (act === "del") { if (!confirm(`Delete "${c.name}"?`)) return; game.counters = game.counters.filter((x) => x !== c); tombstone(c.id); }
    else if (act === "rename") { const name = prompt("Counter name", c.name); if (!name) return; c.name = name; }
    else if (act === "defeat") c.defeated = !c.defeated;
    else c.count = Math.max(0, c.count + (act === "inc" ? 1 : -1));
    c.updatedAt = Date.now();
    save();
  })));
  $("#newNote").onclick = $("#fabNote").onclick = () => editNote(null);
  $("#backToGames").onclick = closeGame;
  $("#gameSettings").onclick = gameDialog;
  $("#showDeleted").onclick = showDeleted;
  $("#newFolder").onclick = () => {
    const name = prompt("Folder name"); if (!name) return;
    const parent = !["all", "none", "guides", "shared"].includes(folderFilter) ? folderFilter : null;
    game.folders.push({ id: uid(), name, parentId: parent, createdAt: Date.now(), updatedAt: Date.now() });
    save();
  };
  if ($("#renameFolder")) $("#renameFolder").onclick = () => {
    const f = game.folders.find((x) => x.id === folderFilter); const name = prompt("Folder name", f.name); if (!name) return;

  };
  if ($("#deleteFolder")) $("#deleteFolder").onclick = () => {
    const f = game.folders.find((x) => x.id === folderFilter);
    if (!confirm(`Delete folder "${f.name}"? Notes inside move up one level.`)) return;
    const now = Date.now();
    game.notes.forEach((n) => { if (n.folderId === f.id) { n.folderId = f.parentId ?? null; n.updatedAt = now; } });
    game.folders.forEach((x) => { if (x.parentId === f.id) { x.parentId = f.parentId ?? null; x.updatedAt = now; } });
    game.folders = game.folders.filter((x) => x !== f); tombstone(f.id);
    folderFilter = "all"; save();
  };

// ---------- the Desk (the web side of the Deck's Tomes; layout kept per browser) ----------
const WEB_TOMES = [
  ["game-brain", "🧠", "Game Brain"], ["left-off", "📍", "Where I Left Off"], ["checklist", "☑️", "Active Checklist"],
  ["counters", "⚔️", "Counters"], ["recent-notes", "📝", "Recent Notes"], ["guides", "📚", "Guides"],
  ["voice-notes", "🎙️", "Voice Notes"], ["game-stats", "📊", "Game Stats"], ["pinned-notes", "📌", "Pinned Notes"], ["workshop", "🏭", "Madness Workshop"],
];
const WEB_TOMES_OFF = ["left-off"];
let deskEditing = false, recentFilter = "all";
function deskLayout() {
  try { const l = JSON.parse(localStorage.getItem("dom-desk") || "null"); if (l?.order) return l; } catch {}
  if (deskDefaults) return { order: deskDefaults.order.filter((id) => WEB_TOMES.some((t) => t[0] === id)), hidden: [...deskDefaults.hidden], collapsed: [...(deskDefaults.collapsed || [])] };
  return { order: WEB_TOMES.map((t) => t[0]), hidden: [...WEB_TOMES_OFF], collapsed: [] };
}
const saveDeskLayout = (l) => localStorage.setItem("dom-desk", JSON.stringify(l));
const byUpdated = (a, b) => b.updatedAt - a.updatedAt;
const openItems = () => [...game.notes].sort((a, b) => (b.pinned ? 1 : 0) - (a.pinned ? 1 : 0) || byUpdated(a, b))
  .flatMap((note) => (note.checklist || []).filter((i) => !i.done).map((item) => ({ note, item })));
const isGuideish = (n) => GUIDE_KINDS.includes(n.kind) || n.kind === "boss";
const counterIcon = { death: "💀", boss: "⚔️", custom: "#" };
const line = (icon, label, body, attrs = "") => `<div class="tline" ${attrs}><span class="ti">${icon}</span><div>${label ? `<div class="tl">${label}</div>` : ""}${body}</div></div>`;
const noteLine = (n) => line(n.pinned ? "📌" : kindOf(n.kind)[1], "", `${esc(n.title)}<div class="meta">${esc(day(n.updatedAt))}${firstLine(n.body) ? " · " + esc(firstLine(n.body)) : ""}</div>`, `data-note="${esc(n.id)}"`);
const RECENT_FILTERS = [["all", "All", () => true], ["note", "Notes", (n) => (n.kind || "note") === "note"], ["guides", "Guides", (n) => GUIDE_KINDS.includes(n.kind)],
  ["tip", "Tips", (n) => n.kind === "tip"], ["boss", "Boss", (n) => n.kind === "boss"], ["build", "Builds", (n) => n.kind === "build"]];

function tomeBody(id) {
  const lo = game.leftOff?.text;
  const counters = [...game.counters].sort((a, b) => (a.defeated ? 1 : 0) - (b.defeated ? 1 : 0) || a.createdAt - b.createdAt);
  const counterRow = (c) => `<div class="counter ${c.defeated ? "defeated" : ""}" data-counter="${esc(c.id)}"><span>${counterIcon[c.kind] || "#"}</span>
    <span class="name">${esc(c.name)} ${c.sessionCount ? `<small>+${c.sessionCount} this session</small>` : ""}</span>
    <button class="icon" data-cact="dec">−</button><span class="n">${c.count}</span><button class="icon" data-cact="inc">+</button></div>`;
  if (id === "game-brain") {
    const next = openItems()[0];
    const guides = game.notes.filter(isGuideish).sort(byUpdated);
    const counter = counters.filter((c) => !c.defeated).sort((a, b) => (b.updatedAt || b.createdAt) - (a.updatedAt || a.createdAt))[0];
    const last = [...game.notes].sort(byUpdated)[0];
    return [
      line("📍", "Left off", lo ? esc(lo) : '<span class="meta">Not set yet.</span>', 'data-leftoff="1"'),
      next ? line("☑️", "Next", `${esc(next.item.text)}<div class="meta">from ${esc(next.note.title)} · tap to tick off</div>`, `data-tick="${esc(next.note.id)}|${esc(next.item.id)}"`) : "",
      guides[0] ? line(kindOf(guides[0].kind)[1], "Guide", esc(guides[0].title), `data-note="${esc(guides[0].id)}"`) : "",
      counter ? line(counterIcon[counter.kind] || "#", "Counter", `${esc(counter.name)}: <b>${counter.count}</b>${counter.sessionCount ? ` <span class="meta">(+${counter.sessionCount} this session)</span>` : ""}`) : "",
      last ? line(kindOf(last.kind)[1], "Last note", esc(last.title), `data-note="${esc(last.id)}"`) : "",
    ].join("") + '<div class="toolbar"><button class="primary" data-view="notes">📝 All notes</button><button data-new="1">+ New note</button></div>';
  }
  if (id === "left-off") return `<textarea id="leftOff" rows="2" placeholder="Shown on the Deck every time you launch this game">${esc(lo ?? "")}</textarea>
      <div class="toolbar" style="margin:6px 0 0"><button id="saveLeftOff" class="primary">Save</button>${lo ? '<button id="clearLeftOff">Clear</button>' : ""}${micButton("leftOff")}</div>`;
  if (id === "checklist") {
    const items = openItems();
    const total = game.notes.reduce((n, x) => n + (x.checklist || []).length, 0);
    if (!total) return '<div class="meta">No checklists yet. Add one to a note and its open items show here.</div>';
    return `<div class="meta">${items.length} of ${total} still to do</div>` +
      items.map(({ note, item }) => line("☐", "", `${esc(item.text)}<div class="meta">${esc(note.title)}</div>`, `data-tick="${esc(note.id)}|${esc(item.id)}"`)).join("") +
      (items.length ? "" : '<div class="meta">All done! 🎉</div>');
  }
  if (id === "counters") return (counters.map(counterRow).join("") || '<div class="meta">No counters yet. Add one from 📝 Notes.</div>');
  if (id === "recent-notes") {
    const f = RECENT_FILTERS.find((x) => x[0] === recentFilter) || RECENT_FILTERS[0];
    const list = game.notes.filter(f[2]).sort(byUpdated).slice(0, 6);
    return `<div class="toolbar">${RECENT_FILTERS.map(([k, label]) => `<button class="small ${k === recentFilter ? "primary" : ""}" data-rf="${k}">${label}</button>`).join("")}</div>` +
      (list.map(noteLine).join("") || '<div class="meta">Nothing here yet.</div>') + '<div class="toolbar"><button class="primary" data-new="1">+ New note</button></div>';
  }
  if (id === "guides") {
    const guides = game.notes.filter(isGuideish);
    if (!guides.length) return '<div class="meta">No guides yet.</div>';
    const counts = ["boss", "walkthrough", "achievement", "guide"].map((k) => [k, guides.filter((g) => g.kind === k).length]).filter((x) => x[1]);
    return `<div>${counts.map(([k, n]) => `<span class="chip">${kindOf(k)[1]} ${kindOf(k)[2]} <b>${n}</b></span>`).join("")}</div>` +
      [...guides].sort(byUpdated).slice(0, 3).map(noteLine).join("") + '<div class="toolbar"><button data-guides="1">Browse guides</button></div>';
  }
  if (id === "voice-notes") {
    const recs = game.notes.flatMap((note) => (note.recordings || []).map((rec) => ({ note, rec }))).sort((a, b) => b.rec.createdAt - a.rec.createdAt).slice(0, 4);
    return recs.map(({ note, rec }) => line("▶", "", `${rec.transcript ? "“" + esc(rec.transcript) + "”" : esc(note.title)}<div class="meta">${esc(day(rec.createdAt))}</div>`, `data-note="${esc(note.id)}"`)).join("")
      || '<div class="meta">No voice notes yet. Record one on the Deck or in a note here.</div>';
  }
  if (id === "game-stats") {
    const h = Math.floor((game.playtimeSeconds ?? 0) / 3600), m = Math.floor(((game.playtimeSeconds ?? 0) % 3600) / 60);
    return `<div class="kv"><span>Playtime</span><b>${h ? h + "h " : ""}${m}m</b><span>Launches</span><b>${game.launchCount ?? 0}</b><span>Last played</span><b>${esc(day(game.lastLaunched))}</b><span>Notes</span><b>${game.notes.length}</b></div>`;
  }
  if (id === "pinned-notes") return game.notes.filter((n) => n.pinned).sort(byUpdated).map(noteLine).join("") || '<div class="meta">No pinned notes.</div>';
  if (id === "workshop") return workshopUrl ? `<div class="meta">Community books for ${esc(game.name)}.</div><div class="toolbar"><a href="${esc(workshopUrl)}/?game=${encodeURIComponent(game.appId)}&name=${encodeURIComponent(game.name)}" target="_blank" rel="noopener"><button class="primary">🏭 Open in the Madness Workshop</button></a></div>` : '<div class="meta">No Workshop set up on this server.</div>';
  return "";
}

function renderDesk() {
  game.notes ??= []; game.folders ??= []; game.counters ??= [];
  const l = deskLayout();
  const ids = [...l.order.filter((id) => WEB_TOMES.some((t) => t[0] === id)), ...WEB_TOMES.map((t) => t[0]).filter((id) => !l.order.includes(id))];
  const on = ids.filter((id) => !l.hidden.includes(id));
  $("#content").innerHTML = `
    <div class="gamehead"><button class="mobile-only" id="backToGames" aria-label="All games">‹ Games</button>${gameIcon(games.find((g) => g.appId === game.appId) || game)}<h2 style="margin:0;flex:1">${esc(game.name)}</h2>
      <button id="deskAdd" class="deskbtn" title="Add or remove Tomes">＋<span> Tomes</span></button><button id="deskEdit" class="deskbtn ${deskEditing ? "primary" : ""}" title="${deskEditing ? "Done" : "Edit the Desk"}">${deskEditing ? "✓<span> Done</span>" : "✏️<span> Edit</span>"}</button></div>
    ${viewSwitch()}
    <div class="desk">${on.map((id, i) => {
      const [, icon, name] = WEB_TOMES.find((t) => t[0] === id);
      const folded = l.collapsed.includes(id);
      return `<div class="box tome" data-tome="${id}"><div class="thead"><button class="tfold" data-fold="${id}">${icon} ${esc(name)} <span class="meta">${folded ? "▸" : "▾"}</span></button>
        ${deskEditing ? `<button class="icon" data-move="${id}|-1" ${i === 0 ? "disabled" : ""}>↑</button><button class="icon" data-move="${id}|1" ${i === on.length - 1 ? "disabled" : ""}>↓</button><button class="icon" data-hide="${id}">✕</button>` : ""}</div>
        ${folded ? "" : `<div class="tbody">${tomeBody(id)}</div>`}</div>`;
    }).join("") || '<p class="meta">Your Desk is empty. Use ＋ Tomes to add some.</p>'}</div>`;

  const c = $("#content");
  const change = (fn) => { const next = deskLayout(); next.order = ids; fn(next); saveDeskLayout(next); renderDesk(); };
  wireViewSwitch();
  wireDictation(c);
  $("#backToGames").onclick = closeGame;
  $("#fabNote").onclick = () => editNote(null);
  $("#deskEdit").onclick = () => { deskEditing = !deskEditing; renderDesk(); };
  $("#deskAdd").onclick = () => {
    const dlg = document.createElement("dialog");
    const cur = deskLayout();
    dlg.innerHTML = `<h3 style="margin-top:0">Tomes</h3><p class="meta">Saved in this browser.</p>${WEB_TOMES.map(([id, icon, name]) =>
      `<label class="radio"><input type="checkbox" data-t="${id}" ${!cur.hidden.includes(id) && (cur.order.includes(id) || !WEB_TOMES_OFF.includes(id)) ? "checked" : ""}><span>${icon} ${esc(name)}</span></label>`).join("")}
      <div class="actions toolbar"><button class="primary" id="tDone">Done</button></div>`;
    document.body.appendChild(dlg); dlg.showModal();
    dlg.querySelector("#tDone").onclick = () => {
      change((next) => { next.hidden = [...dlg.querySelectorAll("[data-t]")].filter((x) => !x.checked).map((x) => x.dataset.t); });
      dlg.close(); dlg.remove();
    };
  };
  c.querySelectorAll("[data-fold]").forEach((b) => (b.onclick = () => change((n) => {
    const id = b.dataset.fold; n.collapsed = n.collapsed.includes(id) ? n.collapsed.filter((x) => x !== id) : [...n.collapsed, id];
  })));
  c.querySelectorAll("[data-hide]").forEach((b) => (b.onclick = () => change((n) => { n.hidden = [...n.hidden.filter((x) => x !== b.dataset.hide), b.dataset.hide]; })));
  c.querySelectorAll("[data-move]").forEach((b) => (b.onclick = () => change((n) => {
    const [id, by] = b.dataset.move.split("|"); const vis = n.order.filter((x) => !n.hidden.includes(x));
    const target = vis[vis.indexOf(id) + Number(by)]; if (!target) return;
    const a = n.order.indexOf(id), t = n.order.indexOf(target); [n.order[a], n.order[t]] = [n.order[t], n.order[a]];
  })));
  c.querySelectorAll("[data-note]").forEach((el) => (el.onclick = () => editNote(game.notes.find((n) => n.id === el.dataset.note))));
  c.querySelectorAll("[data-new]").forEach((el) => (el.onclick = () => editNote(null)));
  c.querySelectorAll("[data-leftoff]").forEach((el) => (el.onclick = () => {
    const text = prompt("Where did you leave off?", game.leftOff?.text ?? ""); if (text === null) return;
    game.leftOff = { text: text.trim(), updatedAt: Date.now(), launchNumber: null }; save();
  }));
  c.querySelectorAll("[data-tick]").forEach((el) => (el.onclick = () => {
    const [noteId, itemId] = el.dataset.tick.split("|");
    const note = game.notes.find((n) => n.id === noteId); const item = note?.checklist?.find((i) => i.id === itemId); if (!item) return;
    item.done = true; note.updatedAt = Date.now(); save(); toast(`☑ ${item.text}`);
  }));
  c.querySelectorAll("[data-counter] button").forEach((b) => (b.onclick = () => {
    const cnt = game.counters.find((x) => x.id === b.closest("[data-counter]").dataset.counter);
    const by = b.dataset.cact === "inc" ? 1 : -1; if (cnt.count + by < 0) return;
    cnt.count += by; cnt.sessionCount = Math.max(0, (cnt.sessionCount || 0) + by); cnt.updatedAt = Date.now(); save();
  }));
  c.querySelectorAll("[data-rf]").forEach((b) => (b.onclick = () => { recentFilter = b.dataset.rf; renderDesk(); }));
  c.querySelectorAll("[data-guides]").forEach((b) => (b.onclick = () => { folderFilter = "guides"; gameView = "notes"; localStorage.setItem("dom-view", "notes"); render(); }));
  if ($("#saveLeftOff")) $("#saveLeftOff").onclick = () => { game.leftOff = { text: $("#leftOff").value.trim(), updatedAt: Date.now(), launchNumber: null }; save(); };
  if ($("#clearLeftOff")) $("#clearLeftOff").onclick = () => { game.leftOff = { text: "", updatedAt: Date.now(), launchNumber: null }; save(); };
}

// ---------- version history / recently deleted ----------
function previewHtml(note) {
  const check = (note.checklist || []).map((c) => `${c.done ? "☑" : "☐"} ${esc(c.text)}`).join("\n");
  const chips = [`Edited ${date(note.updatedAt)}`, ...(note.tags || []).map((t) => "#" + t),
    note.screenshots?.length ? `📷 ${note.screenshots.length}` : "", note.recordings?.length ? `🎙 ${note.recordings.length}` : ""].filter(Boolean);
  return `<h3 style="margin:0">${esc(note.title)}</h3>${chips.map((c) => `<span class="chip">${esc(c)}</span>`).join("")}
    <div class="preview">${esc(note.body) || '<span class="meta">(no information)</span>'}${check ? "\n\n" + check : ""}</div>`;
}

/** Bring back an older or deleted version; it becomes the newest edit so it syncs to the Deck. */
function restoreVersion(note) {
  const restored = { ...structuredClone(note), updatedAt: Date.now() };
  const i = game.notes.findIndex((x) => x.id === restored.id);
  if (i >= 0) game.notes[i] = restored; else game.notes.push(restored);
  $("#panel").close(); $("#editor").close();
  save();
}

function showVersionList({ title, empty, items, label, restoreText }) {
  const dlg = $("#panel");
  const list = () => {
    dlg.innerHTML = `<h2 style="margin-top:0">${esc(title)}</h2>
      ${items.length ? items.map((it, i) => `<div class="version" data-i="${i}"><div class="text"><b>${esc(it.note.title)}</b><div class="meta">${esc(firstLine(it.note.body))}</div></div><span class="chip">${esc(label(it))}</span></div>`).join("") : `<p class="meta">${esc(empty)}</p>`}
      <div class="toolbar"><button id="pClose">Close</button></div>`;
    dlg.querySelectorAll(".version").forEach((el) => (el.onclick = () => detail(items[+el.dataset.i])));
    $("#pClose", dlg).onclick = () => dlg.close();
  };
  const detail = (it) => {
    dlg.innerHTML = `<p class="meta">${esc(label(it))}</p>${previewHtml(it.note)}
      <div class="toolbar"><button class="primary" id="pRestore">${esc(restoreText)}</button><button id="pBack">Back to list</button></div>`;
    $("#pRestore", dlg).onclick = () => { if (confirm("Restore this version? What the note says now is kept in its history.")) restoreVersion(it.note); };
    $("#pBack", dlg).onclick = list;
  };
  list();
  dlg.showModal();
}

async function showHistory(note) {
  const items = await api(`/api/history/${encodeURIComponent(game.appId)}/${encodeURIComponent(note.id)}`);
  showVersionList({ title: `Version history · ${note.title}`, empty: "No earlier versions yet. They appear after the note is edited.",
    items, label: (v) => `${v.reason === "deleted" ? "Before delete" : "Saved"} ${date(v.savedAt)}`, restoreText: "Restore this version" });
}

async function showDeleted() {
  const items = await api(`/api/deleted/${encodeURIComponent(game.appId)}`);
  showVersionList({ title: "Recently deleted", empty: "Nothing deleted.", items, label: (d) => `Deleted ${date(d.deletedAt)}`, restoreText: "Restore note" });
}

// ---------- note editor ----------
function editNote(original, draft = {}) {
  const n = original ? structuredClone(original) : { id: uid(), kind: folderFilter === "guides" ? "guide" : "note", folderId: !["all", "none", "guides", "shared"].includes(folderFilter) ? folderFilter : null, title: "", body: "", tags: [], screenshots: [], recordings: [], checklist: [], pinned: false, spoiler: false, createdAt: 0, updatedAt: 0, launchNumber: null, ...draft };
  n.checklist ??= [];
  n.recordings ??= [];
  const dlg = $("#editor");
  let recorder = null, recStart = 0, recTimer = null, discardRecording = false;

  const uploadAudio = async (blob, ext, durationSec) => {
    const id = uid();
    await api(mediaUrl(game.appId, `${id}.${ext}`), { method: "PUT", body: blob, headers: { "Content-Type": "application/octet-stream" } });
    n.recordings.push({ id, file: `${id}.${ext}`, createdAt: Date.now(), ...(durationSec ? { durationSec } : {}) });
  };

  const toggleRecording = async () => {
    if (recorder) { recorder.stop(); return; }
    if (!navigator.mediaDevices?.getUserMedia || !window.MediaRecorder) {
      alert("Recording needs the secure (https) address, e.g. https://deskofmadness.marshymadness.com. You can still upload an audio file.");
      return;
    }
    let stream;
    try { stream = await navigator.mediaDevices.getUserMedia({ audio: true }); }
    catch (err) { alert("Microphone not available: " + err.message); return; }
    // Opus in WebM/Ogg plays on the Deck; AAC (Safari's mp4) may not.
    const mime = ["audio/webm;codecs=opus", "audio/ogg;codecs=opus", "audio/webm", "audio/mp4"].find((m) => MediaRecorder.isTypeSupported(m)) || "";
    const mr = new MediaRecorder(stream, mime ? { mimeType: mime } : {});
    const chunks = [];
    mr.ondataavailable = (e) => e.data.size && chunks.push(e.data);
    mr.onstop = async () => {
      stream.getTracks().forEach((t) => t.stop());
      clearInterval(recTimer);
      recorder = null;
      if (discardRecording) return;
      collect();
      const type = mr.mimeType || mime;
      const ext = type.includes("ogg") ? "ogg" : type.includes("mp4") ? "m4a" : "webm";
      await uploadAudio(new Blob(chunks, { type }), ext, Math.round((Date.now() - recStart) / 100) / 10);
      draw();
    };
    collect();
    recorder = mr; recStart = Date.now(); mr.start();
    draw();
    recTimer = setInterval(() => {
      const s = Math.floor((Date.now() - recStart) / 1000);
      const b = $("#eRecord", dlg); if (b) b.textContent = `⏹ Stop recording (${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")})`;
    }, 500);
  };
  dlg.onclose = () => { if (recorder) { discardRecording = true; recorder.stop(); } cancelDictation(); };

  const draw = () => {
    dlg.innerHTML = `
      <h2 style="margin-top:0">${original ? "Edit note" : "New note"}</h2>
      <div class="row"><div style="flex:2"><label>Title</label><input id="eTitle" style="width:100%" value="${esc(n.title)}"></div>
        <div><label>Type</label><select id="eKind" style="width:100%">${KINDS.map((k) => `<option value="${k[0]}">${k[1]} ${k[2]}</option>`).join("")}</select></div></div>
      <div class="labelrow"><label>Information <span class="meta">— put [img:1] on its own line to show screenshot 1 there</span></label>${micButton("eBody")}</div>
      <textarea id="eBody" rows="9">${esc(n.body)}</textarea>
      <div class="row">
        <div><label>Tags (comma separated)</label><input id="eTags" style="width:100%" value="${esc((n.tags || []).join(", "))}"></div>
        <div><label>Folder</label><select id="eFolder" style="width:100%"><option value="">No folder</option>${game.folders.map((f) => `<option value="${esc(f.id)}">${esc(folderPath(f.id))}</option>`).join("")}</select></div>
      </div>
      <div class="toolbar"><label style="margin:0"><input type="checkbox" id="ePinned"> Pin to top</label><label style="margin:0"><input type="checkbox" id="eSpoiler"> Spoiler (hidden until revealed)</label></div>
      <label>Checklist</label>
      <div id="eChecklist">${n.checklist.map((c, i) => `<div class="check"><input type="checkbox" data-i="${i}" ${c.done ? "checked" : ""}><input type="text" data-i="${i}" value="${esc(c.text)}"><button class="icon danger" data-del="${i}">✕</button></div>`).join("")}</div>
      <div class="check"><input type="text" id="eNewItem" placeholder="Add an item and press Enter">${micButton("eNewItem")}<button class="icon" id="eAddItem">Add</button></div>
      <label>Screenshots</label>
      <div class="shots">${n.screenshots.map((s, i) => `<div class="shot"><img src="${mediaUrl(game.appId, s.thumb || s.file)}">Screenshot ${i + 1}
          <div class="toolbar" style="margin:4px 0"><button class="icon" data-crop="${i}">Crop</button><button class="icon" data-insert="${i}">In text</button><button class="icon danger" data-rmshot="${i}">Remove</button></div></div>`).join("")}</div>
      <div class="toolbar"><input type="file" id="eUpload" accept="image/*" multiple></div>
      <label>Voice notes</label>
      ${(n.recordings || []).map((r, i) => `<div class="toolbar" style="margin:4px 0"><audio controls preload="none" src="${mediaUrl(game.appId, r.file)}"></audio><span class="meta">${r.durationSec ? Math.round(r.durationSec) + "s · " : ""}${date(r.createdAt)}</span>
          ${!r.transcript && speechOn ? `<button class="icon" data-transcribe="${i}">📝 Transcribe</button>` : ""}<button class="icon danger" data-rmrec="${i}">Remove</button></div>
          ${r.transcript ? `<div class="said"><span class="meta">🎙 said:</span>${esc(r.transcript)} <button class="icon" data-said="${i}">Add to text</button></div>` : ""}`).join("")}
      <div class="toolbar"><button id="eRecord" class="${recorder ? "recording" : ""}">${recorder ? "⏹ Stop recording" : "🎙 Record voice note"}</button>
        <span class="meta">or upload:</span><input type="file" id="eAudio" accept="audio/*"></div>
      ${original ? '<div class="toolbar" style="margin-top:18px"><button id="eShare">👥 Share</button><button id="eHistory">🕘 Version history</button><button class="danger" id="eDelete">Delete note</button></div>' : ""}
      <div class="toolbar actions">
        <button class="primary" id="eSave" ${recorder ? "disabled title=\"Stop the recording first\"" : ""}>Save</button><button id="eCancel">Cancel</button>
      </div>`;
    $("#eFolder", dlg).value = n.folderId || "";
    $("#eKind", dlg).value = n.kind || "note";
    $("#ePinned", dlg).checked = !!n.pinned;
    $("#eSpoiler", dlg).checked = !!n.spoiler;
    wire();
  };

  const collect = () => {
    n.title = $("#eTitle", dlg).value.trim() || "Untitled";
    n.body = $("#eBody", dlg).value;
    n.tags = $("#eTags", dlg).value.split(",").map((t) => t.trim().replace(/^#/, "")).filter(Boolean);
    n.folderId = $("#eFolder", dlg).value || null;
    n.kind = $("#eKind", dlg).value;
    n.pinned = $("#ePinned", dlg).checked;
    n.spoiler = $("#eSpoiler", dlg).checked;
    dlg.querySelectorAll("#eChecklist input[type=text]").forEach((el) => (n.checklist[el.dataset.i].text = el.value));
    dlg.querySelectorAll("#eChecklist input[type=checkbox]").forEach((el) => (n.checklist[el.dataset.i].done = el.checked));
  };

  const wire = () => {
    const addItem = () => { collect(); const t = $("#eNewItem", dlg).value.trim(); if (!t) return; n.checklist.push({ id: uid(), text: t, done: false }); draw(); $("#eNewItem", dlg).focus(); };
    $("#eAddItem", dlg).onclick = addItem;
    $("#eNewItem", dlg).onkeydown = (e) => { if (e.key === "Enter") { e.preventDefault(); addItem(); } };
    dlg.querySelectorAll("[data-del]").forEach((b) => (b.onclick = () => { collect(); n.checklist.splice(+b.dataset.del, 1); draw(); }));
    dlg.querySelectorAll("[data-insert]").forEach((b) => (b.onclick = () => { collect(); n.body += `${n.body && !n.body.endsWith("\n") ? "\n" : ""}[img:${+b.dataset.insert + 1}]\n`; draw(); }));
    dlg.querySelectorAll("[data-rmshot]").forEach((b) => (b.onclick = () => {
      collect(); const idx = +b.dataset.rmshot + 1;
      n.screenshots.splice(idx - 1, 1);
      n.body = n.body.replace(new RegExp(`\\n?\\[img:${idx}\\]\\n?`, "g"), "\n").replace(/\[img:(\d+)\]/g, (m, k) => (+k > idx ? `[img:${k - 1}]` : m));
      draw();
    }));
    $("#eRecord", dlg).onclick = toggleRecording;
    $("#eAudio", dlg).onchange = async (e) => {
      collect();
      for (const file of e.target.files) {
        const ext = (file.name.split(".").pop() || "webm").toLowerCase().replace(/[^a-z0-9]/g, "") || "webm";
        await uploadAudio(file, ext);
      }
      draw();
    };
    if ($("#eHistory", dlg)) $("#eHistory", dlg).onclick = () => showHistory(original);
    if ($("#eShare", dlg)) $("#eShare", dlg).onclick = () => shareDialog(original);
    dlg.querySelectorAll("[data-crop]").forEach((b) => (b.onclick = () => {
      collect();
      const i = +b.dataset.crop;
      cropDialog(n.screenshots[i], (shot) => { n.screenshots[i] = shot; draw(); });
    }));
    wireDictation(dlg);
    dlg.querySelectorAll("[data-said]").forEach((b) => (b.onclick = () => {
      collect(); const t = n.recordings[+b.dataset.said].transcript;
      n.body += `${n.body && !n.body.endsWith("\n") ? "\n" : ""}${t}\n`; draw();
    }));
    dlg.querySelectorAll("[data-transcribe]").forEach((b) => (b.onclick = async () => {
      collect(); const r = n.recordings[+b.dataset.transcribe];
      b.disabled = true; b.textContent = "Transcribing…";
      try {
        r.transcript = (await api(`/api/transcribe/${encodeURIComponent(game.appId)}/${encodeURIComponent(r.file)}`, { method: "POST", json: {} })).text || "";
        if (!r.transcript) alert("No speech found in that recording.");
      } catch (err) { alert("Couldn't transcribe: " + err.message); }
      draw();
    }));
    dlg.querySelectorAll("[data-rmrec]").forEach((b) => (b.onclick = () => { collect(); n.recordings.splice(+b.dataset.rmrec, 1); draw(); }));
    $("#eUpload", dlg).onchange = async (e) => {
      collect();
      for (const file of e.target.files) {
        const ext = (file.name.split(".").pop() || "jpg").toLowerCase().replace(/[^a-z0-9]/g, "") || "jpg";
        const id = uid();
        await api(mediaUrl(game.appId, `${id}.${ext}`), { method: "PUT", body: file, headers: { "Content-Type": "application/octet-stream" } });
        n.screenshots.push({ id, file: `${id}.${ext}`, takenAt: Date.now() });
      }
      draw();
    };
    $("#eCancel", dlg).onclick = () => dlg.close();
    $("#eSave", dlg).onclick = () => {
      collect();
      if (!n.checklist.length) delete n.checklist;
      const now = Date.now();
      n.updatedAt = now; if (!n.createdAt) n.createdAt = now;
      const i = game.notes.findIndex((x) => x.id === n.id);
      if (i >= 0) game.notes[i] = n; else game.notes.push(n);
      dlg.close(); save();
    };
    if ($("#eDelete", dlg)) $("#eDelete", dlg).onclick = () => {
      if (!confirm(`Delete "${n.title}"?`)) return;
      game.notes = game.notes.filter((x) => x.id !== n.id); tombstone(n.id);
      dlg.close(); save();
    };
  };

  draw();
  dlg.showModal();
}

// ---------- people: sharing, shared notes, account ----------
function personRow(u, right) {
  return `<div class="person">${u.avatar ? `<img src="${esc(u.avatar)}">` : '<div class="ph"></div>'}<div class="who"><b>${esc(u.name)}</b><div class="meta">${esc(u.steamId || "")}</div></div>${right}</div>`;
}

async function shareDialog(note) {
  const dlg = $("#panel");
  const draw = async () => {
    const [users, shares] = await Promise.all([api("/api/users"), api(`/api/shares?appId=${encodeURIComponent(game.appId)}`)]);
    const mine = shares.filter((s) => s.noteId === note.id);
    dlg.innerHTML = `<h2 style="margin-top:0">Share "${esc(note.title)}"</h2>
      <p class="meta">People you share with see this note (read-only) in their Shared Notes folder and can copy it. Save your changes first: they see the saved version.</p>
      ${users.map((u) => { const s = mine.find((x) => x.to === u.id);
        return personRow(u, s ? `<button data-unshare="${esc(s.id)}">Stop sharing</button>` : `<button class="primary" data-share="${esc(u.id)}">Share</button>`); }).join("")
        || '<p class="meta">No one else is on this server yet. The owner can invite people under Account → Users.</p>'}
      <div class="toolbar"><button id="pClose">Done</button></div>`;
    $("#pClose", dlg).onclick = () => dlg.close();
    dlg.querySelectorAll("[data-share]").forEach((b) => (b.onclick = async () => { await api("/api/shares", { method: "POST", json: { appId: game.appId, noteId: note.id, to: b.dataset.share } }); draw(); }));
    dlg.querySelectorAll("[data-unshare]").forEach((b) => (b.onclick = async () => { await api(`/api/shares/${b.dataset.unshare}`, { method: "DELETE" }); draw(); }));
  };
  await draw();
  dlg.showModal();
}

function viewShared(s) {
  const dlg = $("#panel");
  const m = (f) => `/api/shared/media/${encodeURIComponent(s.shareId)}/${encodeURIComponent(f)}`;
  const body = esc(s.note.body).replace(/\[img:(\d+)\]/g, (_, i) => { const sh = s.note.screenshots[i - 1]; return sh ? `<img src="${m(sh.file)}" style="max-width:100%;border-radius:6px">` : ""; });
  dlg.innerHTML = `<h2 style="margin-top:0">${esc(s.note.title)}</h2><span class="chip" style="background:#1f5c45">👥 Shared by ${esc(s.fromName)}</span><span class="chip">Edited ${date(s.note.updatedAt)}</span>
    <div class="preview ${s.note.spoiler ? "spoiler" : ""}" onclick="this.classList.remove('spoiler')">${body || '<span class="meta">(no information)</span>'}${(s.note.checklist || []).map((c) => `\n${c.done ? "☑" : "☐"} ${esc(c.text)}`).join("")}</div>
    <div class="shots">${s.note.screenshots.map((sh) => `<div class="shot"><img src="${m(sh.thumb || sh.file)}"></div>`).join("")}</div>
    ${(s.note.recordings || []).map((r) => `<audio controls preload="none" src="${m(r.file)}"></audio>${r.transcript ? `<div class="said"><span class="meta">🎙 said:</span>${esc(r.transcript)}</div>` : ""}`).join(" ")}
    <div class="toolbar"><button class="primary" id="pCopy">Copy to my notes</button><button id="pClose">Close</button></div>`;
  $("#pClose", dlg).onclick = () => dlg.close();
  $("#pCopy", dlg).onclick = async () => {
    $("#pCopy", dlg).disabled = true;
    const copy = structuredClone(s.note);
    for (const item of [...copy.screenshots, ...(copy.recordings || [])]) {
      const id = uid();
      for (const key of ["file", "thumb"]) {
        if (!item[key]) continue;
        const ext = item[key].split(".").pop();
        const name = key === "thumb" ? `${id}.thumb.${ext}` : `${id}.${ext}`;
        const blob = await (await fetch(m(item[key]))).blob();
        await api(mediaUrl(game.appId, name), { method: "PUT", body: blob, headers: { "Content-Type": "application/octet-stream" } });
        item[key] = name;
      }
      item.id = id;
    }
    const now = Date.now();
    Object.assign(copy, { id: uid(), folderId: null, pinned: false, createdAt: now, updatedAt: now, launchNumber: null, source: { type: "shared", id: s.shareId, author: s.fromName } });
    game.notes.push(copy);
    dlg.close(); folderFilter = "all"; await save();
  };
  dlg.showModal();
}

const gameIcon = (g) => (g?.icon ? `<img class="gicon" loading="lazy" src="${esc(g.icon)}" alt="">` : '<span class="gicon ph">🎮</span>');

/** Look up an app ID as you type it and show Steam's name and art. Calls done(info) with the result. */
function wireLookup(input, out, done, naming = false) {
  let timer = null, last = "";
  input.oninput = () => {
    clearTimeout(timer);
    const id = input.value.trim().replace(/^.*\/app\/(\d+).*$/, "$1");
    if (id === last) return;
    last = id;
    if (!/^\d+$/.test(id)) { out.innerHTML = id ? '<span class="meta">An app ID is a number, e.g. 1245620 (or paste a store.steampowered.com link)</span>' : '<span class="meta">Type an app ID</span>'; return done(null); }
    out.innerHTML = '<span class="meta">Looking it up…</span>';
    timer = setTimeout(async () => {
      try {
        const info = await api(`/api/steam/apps/${id}`);
        if (last !== id) return;
        out.innerHTML = info.found
          ? `${info.image ? `<img src="${esc(info.image)}" alt="">` : gameIcon(info)}<div><b>${esc(info.name)}</b><div class="meta">Steam app ${esc(id)}${info.yours ? ` · you already have notes for it${info.yours.name !== info.name ? ` (as ${esc(info.yours.name)})` : ""}` : ""}</div></div>`
          : `<span class="gicon ph">🎮</span><div><b>Not on the Steam store</b><div class="meta">${info.yours ? `You have notes for it as ${esc(info.yours.name)}` : (info.steamApp ? "No Steam app has this ID." : "Looks like a non-Steam shortcut's ID.") + (naming ? " Give it a name below." : "")}</div></div>`;
        done({ ...info, appId: id });
      } catch (err) { out.innerHTML = `<span class="err">${esc(err.message)}</span>`; done(null); }
    }, 350);
  };
  out.innerHTML = '<span class="meta">Type an app ID</span>';
}

  return `<details class="ucard" data-user="${esc(u.id)}" ${open ? "open" : ""}><summary>
      ${u.avatar ? `<img src="${esc(u.avatar)}">` : '<div class="ph"></div>'}
      <div class="who"><b>${esc(u.name)}</b> ${tags.map((t) => `<span class="chip">${t}</span>`).join("")}<div class="meta">${esc(facts)}</div>
        <div class="meta">${u.games} games · ${u.notes} notes · ${bytes(u.bytes)} · ${u.devices} devices · last sign-in ${ago(u.lastLogin)}</div></div></summary>
    <div class="uactions">${!u.canManage ? `<p class="meta">${u.id === a.you ? "This is you. Change your own details under Account." : u.role === "owner" ? "The owner's account can't be changed here." : "Only the owner can change another admin."}</p>` : `
      <div class="toolbar"><span class="meta">Profile</span><button data-uname="${esc(u.id)}">✏️ Rename</button><button data-uemail="${esc(u.id)}">✉️ Email</button><button data-upass="${esc(u.id)}">🔑 Set password</button></div>
      <div class="toolbar"><span class="meta">Access</span>

      <div class="toolbar"><span class="meta">Devices</span><button data-udevices="${esc(u.id)}">📱 Show linked devices (${u.devices})</button><button data-usignout="${esc(u.id)}">🚪 Sign out everywhere</button></div>

function wireAdmin(dlg, a, { act, post, del, draw }) {

  const enc = encodeURIComponent;
  const nameOf = (id) => a?.users.find((u) => u.id === id)?.name || "this user";
  if ($("#logQ", dlg)) $("#logQ", dlg).oninput = (e) => { adminState.logQ = e.target.value; const q = e.target.value.toLowerCase(); on(".logrow", (r) => r.classList.toggle("hidden", !!q && !r.dataset.text.includes(q))); };
  if (adminState.logQ && $("#logQ", dlg)) $("#logQ", dlg).oninput({ target: $("#logQ", dlg) });
  if ($("#uQ", dlg)) {
    $("#uF", dlg).value = adminState.filter;
    $("#uF", dlg).onchange = (e) => { adminState.filter = e.target.value; draw(); };

  }
  on("details.ucard", (d) => (d.ontoggle = () => { if (d.open) adminState.open = d.dataset.user; else if (adminState.open === d.dataset.user) adminState.open = null; }));
  if ($("#aApproveAll", dlg)) $("#aApproveAll", dlg).onclick = () => act(() => post("approve-all"));
  on("[data-approve]", (b) => (b.onclick = () => act(() => post(`users/${enc(b.dataset.approve)}/approve`))));
  on("[data-reject]", (b) => (b.onclick = () => confirm("Reject this request? They can ask again later.") && act(() => del(`users/${enc(b.dataset.reject)}`))));
  if ($("#aInviteBtn", dlg)) $("#aInviteBtn", dlg).onclick = () => act(() => post("invites", { steamId: $("#aInvite", dlg).value }));
  on("[data-uninvite]", (b) => (b.onclick = () => act(() => del(`invites/${enc(b.dataset.uninvite)}`))));
  on("input[name=mode]", (r) => (r.onchange = () => act(() => post("settings", { signupMode: r.value }), "Saved")));
  if ($("#sEmail", dlg)) $("#sEmail", dlg).onchange = (e) => act(() => post("settings", { emailSignups: e.target.checked }), "Saved");
  if ($("#sSpeechDef", dlg)) $("#sSpeechDef", dlg).onchange = (e) => act(() => post("settings", { speechDefault: e.target.checked }), "Saved");
  dlg.querySelectorAll("[data-dt]").forEach((c) => (c.onchange = () => {
    const d = adminState.desk; delete d.builtIn;
    d.hidden = c.checked ? d.hidden.filter((x) => x !== c.dataset.dt) : [...d.hidden, c.dataset.dt];
  }));
  dlg.querySelectorAll("[data-dmove]").forEach((b) => (b.onclick = () => {
    const d = adminState.desk; delete d.builtIn;
    const [i, by] = b.dataset.dmove.split("|").map(Number); [d.order[i], d.order[i + by]] = [d.order[i + by], d.order[i]]; draw();
  }));
  if ($("#sSaveDesk", dlg)) $("#sSaveDesk", dlg).onclick = () => act(() => { const { builtIn, ...d } = adminState.desk; adminState.desk = null; return post("settings", { deskDefaults: d }); }, "Starting Desk saved");
  if ($("#sResetDesk", dlg)) $("#sResetDesk", dlg).onclick = () => act(() => { adminState.desk = null; return post("settings", { deskDefaults: null }); }, "Back to the built-in Desk");
  if ($("#sSaveWorkshop", dlg)) $("#sSaveWorkshop", dlg).onclick = () => act(() => post("settings", { workshopUrl: $("#sWorkshop", dlg).value.trim().replace(/\/+$/, ""), allowedScrolls: $("#sScrolls", dlg).value, scrollQuotaMb: +$("#sScrollMb", dlg).value || 0 }), "Saved");

  if ($("#sReaderDays", dlg)) $("#sReaderDays", dlg).onchange = (e) => act(() => post("settings", { readerCacheDays: +e.target.value }), "Saved");
  if ($("#sReaderClear", dlg)) $("#sReaderClear", dlg).onclick = () => confirm("Delete every saved reader page? They're made again the next time someone opens them.") && act(async () => { const r = await post("reader/clear"); toast(`Removed ${r.removed} pages`); });

  on("[data-uspeech]", (c) => (c.onchange = () => act(() => post(`users/${enc(c.dataset.uspeech)}/speech`, { allowed: c.checked }))));
  on("[data-uadmin]", (c) => (c.onchange = () => { if (!confirm(c.checked ? `Make ${nameOf(c.dataset.uadmin)} an admin? They can approve, suspend and remove ordinary users and change server settings.` : `Remove admin from ${nameOf(c.dataset.uadmin)}?`)) { c.checked = !c.checked; return; } act(() => post(`users/${enc(c.dataset.uadmin)}/role`, { admin: c.checked })); }));
  on("[data-usignout]", (b) => (b.onclick = () => confirm(`Sign ${nameOf(b.dataset.usignout)} out everywhere? Their Deck and phone have to be linked again.`) && act(() => post(`users/${enc(b.dataset.usignout)}/signout`), "Signed out")));
  on("[data-ususpend]", (b) => (b.onclick = () => { const s = b.dataset.on === "1"; if (s && !confirm(`Suspend ${nameOf(b.dataset.ususpend)}? They're signed out, their devices are unlinked, and they can't sign in until you restore them. Their notes are kept.`)) return; act(() => post(`users/${enc(b.dataset.ususpend)}/status`, { suspended: s })); }));
  on("[data-uremove]", (b) => (b.onclick = () => confirm(`Remove ${nameOf(b.dataset.uremove)}? Their notes are moved to a removed-users folder on the server.`) && act(() => del(`users/${enc(b.dataset.uremove)}`))));

    box.querySelectorAll("[data-udevdel]").forEach((x) => (x.onclick = () => act(() => del(`users/${enc(id)}/devices/${enc(x.dataset.udevdel)}`))));
  }));

function toast(text) {
  const t = $("#saving");
  t.textContent = text; t.classList.remove("hidden");
