<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1b1722">
<title>Session Notes Bookstore</title>
<style>
  :root { color-scheme: dark; --bg: #15131a; --panel: #1f1b27; --line: #2e2939; --chip: #2f2a3b; --accent: #b98cff; --danger: #e5484d; }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: system-ui, sans-serif; background: var(--bg); color: #ebe7f2; }
  a { color: var(--accent); }
  button, input, select, textarea { font: inherit; color: inherit; }
  button { background: #2c2738; border: 1px solid #3d3650; border-radius: 6px; padding: 6px 12px; cursor: pointer; }
  button:hover { background: #352f44; } button.primary { background: var(--accent); border-color: var(--accent); color: #160f22; font-weight: 600; }
  button.on { background: #463a63; border-color: var(--accent); } button.danger { color: var(--danger); }
  input, select, textarea { background: #252130; border: 1px solid #3d3650; border-radius: 6px; padding: 6px 10px; }
  textarea { width: 100%; resize: vertical; line-height: 1.45; }
  header { padding: 12px 20px; background: var(--panel); display: flex; gap: 12px; align-items: center; position: sticky; top: 0; z-index: 2; flex-wrap: wrap; }
  header h1 { font-size: 18px; margin: 0; cursor: pointer; } header .grow { flex: 1; }
  main { max-width: 1100px; margin: 0 auto; padding: 20px; }
  .meta, small { opacity: .65; font-size: 12px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 10px; }
  .game { background: var(--panel); border-radius: 8px; padding: 12px; cursor: pointer; display: flex; gap: 10px; align-items: center; }
  .game:hover { background: #28233a; } .game img { width: 92px; height: 43px; object-fit: cover; border-radius: 4px; background: #2a2536; }
  .toolbar { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; margin: 10px 0; }
  .card { background: var(--panel); border-radius: 8px; padding: 12px 14px; margin-bottom: 10px; display: flex; gap: 12px; cursor: pointer; }
  .card:hover { background: #28233a; } .card .text { flex: 1; min-width: 0; }
  .card h3 { margin: 0; font-size: 15px; } .card .first { opacity: .75; font-size: 13px; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .card img.thumb { width: 140px; height: 79px; object-fit: cover; border-radius: 6px; }
  .chip { display: inline-block; font-size: 11px; background: var(--chip); border-radius: 8px; padding: 1px 7px; margin: 4px 4px 0 0; }
  .who { display: inline-flex; align-items: center; gap: 6px; } .who img { width: 20px; height: 20px; border-radius: 3px; }
  .blur { filter: blur(6px); }
  dialog { background: var(--panel); color: inherit; border: 1px solid var(--line); border-radius: 10px; width: min(900px, 95vw); max-height: 92vh; padding: 20px; }
  dialog::backdrop { background: rgba(0,0,0,.65); }
  dialog label { display: block; font-size: 12px; opacity: .75; margin: 12px 0 4px; }
  .body { white-space: pre-wrap; line-height: 1.5; margin: 12px 0; } .body img { max-width: 100%; border-radius: 6px; display: block; margin: 8px 0; }
  .gallery { display: flex; gap: 8px; flex-wrap: wrap; } .gallery img { width: 200px; height: 112px; object-fit: cover; border-radius: 6px; cursor: zoom-in; }
  .spoiler-gate { text-align: center; padding: 30px; background: #1a1622; border-radius: 10px; margin: 12px 0; }
  .comment { border-top: 1px solid var(--line); padding: 10px 0; } .comment p { margin: 4px 0 0; white-space: pre-wrap; }
  .row { display: flex; gap: 10px; } .row > * { flex: 1; }
  .check { display: flex; gap: 8px; align-items: center; padding: 3px 0; } .check input[type=text] { flex: 1; }
  .shot { width: 160px; font-size: 11px; } .shot img { width: 160px; height: 90px; object-fit: cover; border-radius: 6px; display: block; }
  .code-input { font-size: 28px; letter-spacing: 4px; text-align: center; text-transform: uppercase; width: 100%; padding: 12px; }
  .hidden { display: none !important; }
  .steam-btn { background: #171a21; border: 1px solid #66c0f4; color: #66c0f4; padding: 6px 12px; border-radius: 6px; text-decoration: none; font-weight: 600; }
  .badge { background: var(--danger); color: #fff; border-radius: 9px; font-size: 11px; padding: 0 6px; margin-left: 4px; }
  .redchip { background: #5a1f24; }
  #announce { background: #3b2a5c; padding: 10px 20px; display: flex; gap: 12px; align-items: center; }
  #announce span { flex: 1; white-space: pre-wrap; }
  .box { background: var(--panel); border-radius: 8px; padding: 10px 14px; margin: 8px 0; } .warnbox { background: #3a2c12; } .warnbox a { color: #f5c46b; }
  .adminbar { background: #2a2140; border-radius: 8px; padding: 6px 10px; }
  /* admin */
  main:has(.admin) { max-width: 1300px; }
  .admin { display: grid; grid-template-columns: 220px 1fr; gap: 20px; align-items: start; }
  .aside { position: sticky; top: 76px; background: var(--panel); border-radius: 10px; padding: 10px; }
  .aside .ahead { font-weight: 700; font-size: 16px; padding: 4px 8px 6px; }
  .aside .agroup { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; opacity: .55; margin: 12px 8px 4px; }
  .aside button { display: flex; align-items: center; gap: 6px; width: 100%; text-align: left; background: none; border: 0; padding: 8px 10px; }
  .aside button:hover { background: #2c2738; } .aside button.active { background: #463a63; color: #fff; } .aside .badge { margin-left: auto; }
  .apage { min-width: 0; } .apage h2 { margin-top: 0; } .apage h4 { margin: 18px 0 6px; font-size: 14px; opacity: .85; }
  .stats { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 8px; }
  .stat { background: var(--panel); border-radius: 8px; padding: 10px 12px; } .stat b { display: block; font-size: 22px; } .stat span { font-size: 12px; opacity: .65; }
  .stat.warn b { color: #f5a524; }
  .mini { display: flex; gap: 8px; align-items: center; padding: 4px 0; } .mini img { width: 64px; height: 30px; object-fit: cover; border-radius: 3px; }
  .logrow { display: grid; grid-template-columns: 170px 1fr; gap: 10px; padding: 7px 0; border-bottom: 1px solid var(--line); font-size: 14px; }
  .arow { background: var(--panel); border-radius: 8px; padding: 10px 12px; margin-bottom: 8px; display: flex; gap: 12px; align-items: center; }
  .arow .text { flex: 1; min-width: 0; } .arow [data-open] { cursor: pointer; } .arow .first { opacity: .7; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .arow .acts { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; } .arow .gart { width: 92px; height: 43px; object-fit: cover; border-radius: 4px; }
  .quote { background: #1a1622; border-radius: 6px; padding: 6px 10px; margin: 6px 0; white-space: pre-wrap; font-size: 14px; max-height: 120px; overflow: auto; }
  .bulk { background: var(--panel); border-radius: 8px; padding: 6px 10px; position: sticky; top: 64px; z-index: 1; }
  .ucard { background: var(--panel); border-radius: 8px; margin-bottom: 8px; }
  .ucard summary { display: flex; gap: 10px; align-items: center; padding: 10px 12px; cursor: pointer; list-style: none; } .ucard summary::-webkit-details-marker { display: none; }
  .ucard summary img, .ucard summary .ph { width: 36px; height: 36px; border-radius: 4px; background: #2a2536; flex: none; } .ucard summary .text { flex: 1; min-width: 0; }
  .ucard[open] summary { border-bottom: 1px solid var(--line); } .uactions { padding: 4px 12px 10px; } .uactions .toolbar > .meta:first-child { width: 70px; }
  label.inline, label.radio { display: flex; gap: 8px; align-items: center; opacity: 1; margin: 0; font-size: 14px; }
  label.radio { align-items: flex-start; background: var(--panel); border-radius: 8px; padding: 10px 12px; margin: 8px 0; cursor: pointer; } label.radio input { margin-top: 3px; }
  .apage label:not(.inline):not(.radio) { display: block; font-size: 12px; opacity: .75; margin: 12px 0 4px; }
  @media (max-width: 760px) {
    .admin { grid-template-columns: minmax(0, 1fr); gap: 10px; }
    .aside { position: static; display: flex; overflow-x: auto; gap: 4px; padding: 6px; }
    .aside .agroup, .aside .ahead { display: none; } .aside button { width: auto; flex: none; white-space: nowrap; border-radius: 18px; background: #2c2738; }
    .logrow { grid-template-columns: minmax(0, 1fr); gap: 2px; } .arow { flex-wrap: wrap; } .arow .acts { width: 100%; justify-content: flex-start; }
    .bulk { top: 0; position: static; } .uactions .toolbar > .meta:first-child { width: 100%; }
    main { padding: 12px; } header { padding: 10px 12px; } .card img.thumb { width: 90px; height: 51px; }
    dialog { width: 100vw; max-width: 100vw; height: 100dvh; max-height: 100dvh; margin: 0; border-radius: 0; border: 0; }
    .row { flex-direction: column; gap: 0; } button, select, input:not([type=checkbox]):not([type=radio]) { min-height: 42px; }
    input, select, textarea { font-size: 16px; }
  }
</style>
</head>
<body>
<header>
  <h1 id="home">📚 Bookstore</h1>
  <input id="gameSearch" class="grow" placeholder="Search games…">
  <button id="adminBtn" class="hidden">🛡 Admin</button>
  <span id="userBox"></span>
</header>
<div id="announce" class="hidden"><span>📣 <span id="announceText"></span></span><button id="announceClose" aria-label="Hide">✕</button></div>
<main id="main"></main>
<dialog id="dlg"></dialog>
<dialog id="dlg2"></dialog>

<script>
const $ = (s, el = document) => el.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
const date = (ms) => (ms ? new Date(ms).toLocaleString(undefined, { dateStyle: "medium", timeStyle: "short" }) : "—");
const uid = () => (crypto.randomUUID ? crypto.randomUUID() : "xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx".replace(/[xy]/g, (c) => { const r = (Math.random() * 16) | 0; return (c === "x" ? r : (r & 3) | 8).toString(16); }));
const day = (ms) => (ms ? new Date(ms).toLocaleDateString(undefined, { dateStyle: "medium" }) : "—");
const media = (f) => `/api/media/${encodeURIComponent(f)}`;
const art = (appId) => `https://cdn.cloudflare.steamstatic.com/steam/apps/${encodeURIComponent(appId)}/capsule_184x69.jpg`;
const KINDS = [["note", "📝", "Note"], ["guide", "📘", "Guide"], ["tip", "💡", "Tip"], ["walkthrough", "🧭", "Walkthrough"],
  ["boss", "⚔️", "Boss strategy"], ["build", "🛡️", "Build / loadout"], ["collectibles", "🗺️", "Collectibles / map"],
  ["secret", "🔮", "Secret / easter egg"], ["settings", "⚙️", "Deck settings"], ["achievement", "🏆", "Achievement guide"]];
const kindOf = (k) => KINDS.find((x) => x[0] === k) || KINDS[0];
let me = null, admin = false, ownerAdmin = false, badges = {}, siteInfo = {}, view = { appId: null, gameName: "", kinds: [], has: [], sort: "top", q: "" };

async function api(path, opts = {}) {
  const r = await fetch(path, { ...opts, headers: { "X-Requested-With": "bookstore", ...(opts.json ? { "Content-Type": "application/json" } : {}), ...(opts.headers || {}) },
    body: opts.json ? JSON.stringify(opts.json) : opts.body });
  const data = await r.json().catch(() => null);
  if (!r.ok) throw new Error(data?.error || r.statusText);
  return data;
}
const who = (u) => `<span class="who">${u.avatar ? `<img src="${esc(u.avatar)}">` : ""}${esc(u.name)}</span>`;
const signIn = (next = location.pathname + location.search) => `/auth/steam?next=${encodeURIComponent(next)}`;

async function loadMe() {
  const r = await api("/api/me");
  me = r.user; admin = r.admin; ownerAdmin = r.ownerAdmin; siteInfo = r.site || {};
  badges = { openReports: r.openReports || 0, pendingPosts: r.pendingPosts || 0 };
  paintHeader();
}

function paintHeader() {
  $("#userBox").innerHTML = me ? `${who(me)} <button id="logout">Log out</button>` : `<a class="steam-btn" href="${signIn()}">Sign in with Steam</a>`;
  if (me) $("#logout").onclick = async () => { await api("/api/logout", { method: "POST" }); location.reload(); };
  const n = (badges.openReports || 0) + (badges.pendingPosts || 0);
  $("#adminBtn").classList.toggle("hidden", !admin);
  $("#adminBtn").innerHTML = `🛡 Admin${n ? `<span class="badge">${n}</span>` : ""}`;
  $("#adminBtn").onclick = () => adminPage();
  const text = [siteInfo.announcement, siteInfo.readOnly ? "🔒 The Bookstore is read-only for now: you can browse and save posts, but not post or comment." : ""].filter(Boolean).join("\n");
  const hidden = localStorage.getItem("bs-announce-hidden") === text;
  $("#announce").classList.toggle("hidden", !text || hidden);
  $("#announceText").textContent = text;
  $("#announceClose").onclick = () => { localStorage.setItem("bs-announce-hidden", text); $("#announce").classList.add("hidden"); };
}
const canPost = () => me && (admin || !siteInfo.readOnly);
/** Redraw whatever page is showing (after a change in a dialog). */
const refreshView = () => (new URLSearchParams(location.search).get("admin") ? adminPage() : view.appId ? renderGame() : home());

async function start() {
  await loadMe();
  const err = new URLSearchParams(location.search).get("error");
  if (err) alert(err);
  if (location.pathname === "/link") return linkPage();
  const params = new URLSearchParams(location.search);
  if (params.get("admin") && admin) return adminPage(params.get("admin"));
  if (params.get("game")) return openGame(params.get("game"), params.get("name") || "");
  home();
}

// ---------- pages ----------
async function home(q = "") {
  view.appId = null;
  history.replaceState(null, "", "/");
  const [games, recent] = await Promise.all([api(`/api/games?q=${encodeURIComponent(q)}`), q ? [] : api("/api/entries?sort=new")]);
  $("#main").innerHTML = `
    <p>Notes, guides and tips for your games, shared by players. Open one on your Deck from the <b>Bookstore</b> tab in Session Notes.</p>
    <h2>${q ? "Games matching “" + esc(q) + "”" : "Games"}</h2>
    <div class="grid">${games.map((g) => `<div class="game" data-app="${esc(g.appId)}" data-name="${esc(g.gameName)}"><img src="${art(g.appId)}" onerror="this.style.visibility='hidden'"><div><b>${esc(g.gameName)}</b><br><small>${g.count} posts</small></div></div>`).join("") || '<p class="meta">Nothing yet. Be the first to post!</p>'}</div>
    ${canPost() ? '<div class="toolbar"><button class="primary" id="newAny">+ Post something</button></div>' : ""}
    ${recent.length ? `<h2>Latest</h2>${recent.slice(0, 15).map(card).join("")}` : ""}`;
  $("#main").querySelectorAll(".game").forEach((el) => (el.onclick = () => openGame(el.dataset.app, el.dataset.name)));
  wireCards();
  if ($("#newAny")) $("#newAny").onclick = () => editEntry(null, {});
}

async function openGame(appId, gameName) {
  Object.assign(view, { appId, gameName });
  history.replaceState(null, "", `/?game=${encodeURIComponent(appId)}&name=${encodeURIComponent(gameName)}`);
  await renderGame();
}

async function renderGame() {
  const params = new URLSearchParams({ appId: view.appId, sort: view.sort, q: view.q });
  if (view.kinds.length) params.set("kind", view.kinds.join(","));
  if (view.has.length) params.set("has", view.has.join(","));
  const entries = await api(`/api/entries?${params}`);
  if (!view.gameName && entries[0]) view.gameName = entries[0].gameName;
  $("#main").innerHTML = `
    <div class="toolbar"><button id="back">← All games</button><img src="${art(view.appId)}" style="height:34px;border-radius:4px" onerror="this.remove()"><h2 style="margin:0">${esc(view.gameName || view.appId)}</h2>
      <span style="flex:1"></span>${canPost() ? '<button class="primary" id="newEntry">+ Post for this game</button>' : me ? "" : `<a class="steam-btn" href="${signIn()}">Sign in to post</a>`}</div>
    <div class="toolbar">${KINDS.map((k) => `<button data-kind="${k[0]}" class="${view.kinds.includes(k[0]) ? "on" : ""}">${k[1]} ${k[2]}</button>`).join("")}</div>
    <div class="toolbar"><span class="meta">Contains:</span>
      ${[["screenshots", "📷 Screenshots"], ["voice", "🎙 Voice recording"], ["checklist", "☑ Checklist"]].map(([h, l]) => `<button data-has="${h}" class="${view.has.includes(h) ? "on" : ""}">${l}</button>`).join("")}
      <span style="flex:1"></span><input id="q" placeholder="Search posts…" value="${esc(view.q)}">
      <select id="sort"><option value="top">Most liked</option><option value="new">Newest</option><option value="updated">Recently updated</option></select></div>
    ${entries.map(card).join("") || '<p class="meta">No posts match.</p>'}`;
  $("#sort").value = view.sort;
  $("#back").onclick = () => home();
  $("#sort").onchange = (e) => { view.sort = e.target.value; renderGame(); };
  $("#q").onchange = (e) => { view.q = e.target.value; renderGame(); };
  $("#main").querySelectorAll("[data-kind]").forEach((b) => (b.onclick = () => { const k = b.dataset.kind; view.kinds = view.kinds.includes(k) ? view.kinds.filter((x) => x !== k) : [...view.kinds, k]; renderGame(); }));
  $("#main").querySelectorAll("[data-has]").forEach((b) => (b.onclick = () => { const k = b.dataset.has; view.has = view.has.includes(k) ? view.has.filter((x) => x !== k) : [...view.has, k]; renderGame(); }));
  if ($("#newEntry")) $("#newEntry").onclick = () => editEntry(null, { appId: view.appId, gameName: view.gameName });
  wireCards();
}

function card(e) {
  const k = kindOf(e.kind);
  return `<div class="card" data-id="${esc(e.id)}"><div class="text">
    <h3>${e.pinned ? "📌 " : ""}${k[1]} ${esc(e.title)}${e.status === "pending" ? ' <span class="chip">⏳ Waiting for approval</span>' : e.status === "hidden" ? ' <span class="chip">🙈 Hidden</span>' : ""}</h3>
    <div class="first ${e.spoiler ? "blur" : ""}">${e.spoiler ? "Spoiler" + (e.spoilerLabel ? ": " + esc(e.spoilerLabel) : "") : esc(e.firstLine) || "&nbsp;"}</div>
    <span class="chip">${k[2]}</span>${view.appId ? "" : `<span class="chip">🎮 ${esc(e.gameName)}</span>`}<span class="chip">${who(e.author)}</span>
    <span class="chip">♥ ${e.likes}</span><span class="chip">💬 ${e.comments}</span>
    ${e.hasScreenshots ? '<span class="chip">📷</span>' : ""}${e.hasVoice ? '<span class="chip">🎙</span>' : ""}${e.hasChecklist ? '<span class="chip">☑</span>' : ""}
    ${e.spoiler ? `<span class="chip">🙈 ${esc(e.spoilerLabel || "Spoiler")}</span>` : ""}${e.tags.map((t) => `<span class="chip">#${esc(t)}</span>`).join("")}</div>
    ${e.thumb ? `<img class="thumb ${e.spoiler ? "blur" : ""}" loading="lazy" src="${media(e.thumb)}">` : ""}</div>`;
}
function wireCards() { $("#main").querySelectorAll(".card").forEach((c) => (c.onclick = () => openEntry(c.dataset.id))); }

// ---------- entry view ----------
async function openEntry(id, revealed = false, prefetched = null) {
  const e = prefetched || await api(`/api/entries/${encodeURIComponent(id)}`);
  const dlg = $("#dlg");
  const k = kindOf(e.kind);
  const inlined = new Set();
  const body = esc(e.body).replace(/\[img:(\d+)\]/g, (_, i) => { inlined.add(i - 1); const s = e.screenshots[i - 1]; return s ? `<img src="${media(s.file)}">` : ""; });
  const hidden = e.spoiler && !revealed;
  dlg.innerHTML = `
    <div class="toolbar" style="margin-top:0"><h2 style="margin:0;flex:1">${k[1]} ${esc(e.title)}</h2><button id="close">Close</button></div>
    <span class="chip">${k[2]}</span><span class="chip">🎮 ${esc(e.gameName)}</span><span class="chip">by ${who(e.author)}</span>
    <span class="chip">Updated ${date(e.updatedAt)}${e.updatedBy && e.updatedBy.steamId !== e.author.steamId ? " by " + esc(e.updatedBy.name) : ""}</span>
    ${e.tags.map((t) => `<span class="chip">#${esc(t)}</span>`).join("")}
    <span class="chip">${{ owner: "🔒 Only the poster edits", select: "👥 Selected people edit", anyone: "✏️ Anyone signed in can edit" }[e.editPolicy]}</span>
    <span class="chip">${e.allowCopy ? "📋 Copying allowed" : "🚫 No copies"}</span>
    ${e.pinned ? '<span class="chip">📌 Pinned</span>' : ""}${e.locked ? '<span class="chip">🔒 Locked</span>' : ""}
    ${e.status === "pending" ? '<div class="box warnbox">⏳ Waiting for an admin to check it. Only you and the admins can see it for now.</div>' : e.status === "hidden" ? '<div class="box warnbox">🙈 Hidden by an admin. Only the poster and admins can see it.</div>' : ""}
    ${e.canModerate ? `<div class="toolbar adminbar"><span class="meta">🛡 Admin</span>
      ${e.status !== "published" ? '<button class="primary" data-mod="publish">✅ Publish</button>' : '<button data-mod="hide">🙈 Hide</button>'}
      <button data-mod="${e.pinned ? "unpin" : "pin"}">${e.pinned ? "Unpin" : "📌 Pin"}</button><button data-mod="${e.locked ? "unlock" : "lock"}">${e.locked ? "🔓 Unlock" : "🔒 Lock"}</button></div>` : ""}
    ${hidden ? `<div class="spoiler-gate"><p>🙈 Spoiler${e.spoilerLabel ? `: <b>${esc(e.spoilerLabel)}</b>` : ""}</p><button class="primary" id="reveal">Reveal</button></div>` : `
      <div class="body">${body || '<span class="meta">(no text)</span>'}</div>
      ${e.checklist.length ? `<div>${e.checklist.map((c) => `<div>☐ ${esc(c.text)}</div>`).join("")}</div>` : ""}
      ${e.recordings.map((r) => `<audio controls preload="none" src="${media(r.file)}"></audio>`).join(" ")}
      <div class="gallery">${e.screenshots.filter((_, i) => !inlined.has(i)).map((s) => `<img src="${media(s.thumb || s.file)}" data-full="${esc(s.file)}">`).join("")}</div>`}
    <div class="toolbar">
      <button id="like" class="${e.liked ? "on" : ""}">♥ ${e.likes}</button>
      ${e.canEdit ? '<button id="edit">✏️ Edit</button>' : ""}<button id="history">🕘 History</button>
      ${e.canDelete ? '<button id="del" class="danger">Delete</button>' : ""}${me && !e.isAuthor ? '<button id="report" title="Report to the admins">🚩 Report</button>' : ""}
      <span style="flex:1"></span>${e.allowCopy ? `<button class="primary" id="save">📥 Save to my notes</button>${window.SessionNotesApp ? "" : '<button id="saveWhere" title="Change your Session Notes address">⚙️</button>'}` : ""}
    </div>
    <h3>Comments (${e.commentList.length})</h3>
    ${e.commentList.map((c) => `<div class="comment">${who(c.author)} <small>${date(c.createdAt)}</small> ${c.canDelete ? `<button class="danger" data-delc="${esc(c.id)}" style="float:right">✕</button>` : ""}${me && c.author.steamId !== me.steamId ? `<button data-repc="${esc(c.id)}" style="float:right;margin-right:6px" title="Report">🚩</button>` : ""}<p>${esc(c.text)}</p></div>`).join("") || '<p class="meta">No comments yet.</p>'}
    ${me && e.canComment ? '<textarea id="comment" rows="2" placeholder="Add a comment…"></textarea><div class="toolbar"><button class="primary" id="postComment">Comment</button></div>'
      : me ? '<p class="meta">💬 Comments are closed here.</p>' : `<p><a href="${signIn()}">Sign in with Steam</a> to like and comment.</p>`}`;
  $("#close", dlg).onclick = () => dlg.close();
  if ($("#reveal", dlg)) $("#reveal", dlg).onclick = () => {
    const draft = $("#comment", dlg)?.value || "";
    openEntry(id, true, e).then(() => { if ($("#comment", dlg)) $("#comment", dlg).value = draft; });
  };
  dlg.querySelectorAll(".gallery img").forEach((img) => (img.onclick = () => window.open(media(img.dataset.full))));
  $("#like", dlg).onclick = async () => { if (!me) return (location.href = signIn()); await api(`/api/entries/${id}/like`, { method: "POST" }); openEntry(id, revealed); };
  if ($("#edit", dlg)) $("#edit", dlg).onclick = () => editEntry(e);
  $("#history", dlg).onclick = () => showHistory(e);
  if ($("#save", dlg)) $("#save", dlg).onclick = () => saveToNotes(e.id);
  if ($("#saveWhere", dlg)) $("#saveWhere", dlg).onclick = () => notesUrl(true);
  if ($("#del", dlg)) $("#del", dlg).onclick = async () => { if (!confirm("Delete this post for everyone?")) return; await api(`/api/entries/${id}`, { method: "DELETE" }); dlg.close(); refreshView(); };
  if ($("#report", dlg)) $("#report", dlg).onclick = () => report("entry", id);
  dlg.querySelectorAll("[data-repc]").forEach((b) => (b.onclick = () => report("comment", b.dataset.repc)));
  dlg.querySelectorAll("[data-mod]").forEach((b) => (b.onclick = async () => {
    try { await api("/api/admin/entries/bulk", { method: "POST", json: { ids: [id], action: b.dataset.mod } }); await refreshBadge(); openEntry(id, revealed); refreshView(); }
    catch (err) { alert(err.message); }
  }));
  if ($("#postComment", dlg)) $("#postComment", dlg).onclick = async () => {
    const text = $("#comment", dlg).value.trim(); if (!text) return;
    await api(`/api/entries/${id}/comments`, { method: "POST", json: { text } }); openEntry(id, revealed);
  };
  dlg.querySelectorAll("[data-delc]").forEach((b) => (b.onclick = async () => { await api(`/api/comments/${b.dataset.delc}`, { method: "DELETE" }); openEntry(id, revealed); }));
  if (!dlg.open) dlg.showModal();
}

// ---------- copy into your own Session Notes ----------
/** Your Session Notes server address (asked once, remembered in this browser). */
function notesUrl(ask = false) {
  let url = localStorage.getItem("bs-notes-url") || "";
  if (ask || !url) {
    const typed = prompt("Address of your Session Notes server (the website you edit your notes on):", url || "https://");
    if (!typed) return null;
    url = typed.trim().replace(/\/+$/, "");
    if (!/^https?:\/\//i.test(url)) url = "https://" + url;
    localStorage.setItem("bs-notes-url", url);
  }
  return url;
}

/** The Session Notes site does the copy (it downloads the post and its media into your notes). */
function saveToNotes(id) {
  if (window.SessionNotesApp?.saveToNotes) return window.SessionNotesApp.saveToNotes(id); // Android app: switches to the Notes tab
  const url = notesUrl();
  if (url) window.open(`${url}/?import=bookstore:${encodeURIComponent(id)}`, "_blank", "noopener");
}

async function showHistory(e) {
  const versions = await api(`/api/entries/${e.id}/history`);
  const d = $("#dlg2");
  d.innerHTML = `<h2 style="margin-top:0">Edit history</h2>${versions.map((v) => `<div class="comment"><b>${esc(v.entry.title)}</b> <small>saved ${date(v.savedAt)} · by ${esc(v.savedBy.name)}</small><p class="meta">${esc((v.entry.body || "").slice(0, 200))}</p></div>`).join("") || '<p class="meta">No earlier versions.</p>'}
    <div class="toolbar"><button id="c2">Close</button></div>`;
  $("#c2", d).onclick = () => d.close();
  d.showModal();
}

// ---------- editor ----------
async function upload(blob, ext, thumb = false) {
  return (await api(`/api/uploads?ext=${encodeURIComponent(ext)}${thumb ? "&thumb=1" : ""}`, { method: "POST", body: blob })).file;
}

function editEntry(orig, defaults) {
  const isNew = !orig;
  const e = orig ? structuredClone(orig) : { title: "", body: "", kind: "guide", tags: [], checklist: [], screenshots: [], recordings: [], spoiler: false,
    spoilerLabel: "", editPolicy: "owner", editors: [], allowCopy: true, appId: defaults.appId || "", gameName: defaults.gameName || "" };
  const canAdmin = isNew || orig.isAuthor || admin;
  const d = $("#dlg2");
  const draw = () => {
    d.innerHTML = `<h2 style="margin-top:0">${isNew ? "New post" : "Edit post"}</h2>
      ${isNew ? `<div class="row"><div><label>Game name</label><input id="fGame" style="width:100%" value="${esc(e.gameName)}"></div>
        <div><label>Steam app ID <a href="https://steamdb.info" target="_blank" class="meta">find it</a></label><input id="fApp" style="width:100%" inputmode="numeric" value="${esc(e.appId)}"></div></div>` : ""}
      <div class="row"><div style="flex:2"><label>Title</label><input id="fTitle" style="width:100%" value="${esc(e.title)}"></div>
        <div><label>Type</label><select id="fKind" style="width:100%">${KINDS.map((k) => `<option value="${k[0]}">${k[1]} ${k[2]}</option>`).join("")}</select></div></div>
      <label>Text <span class="meta">— [img:1] on its own line shows screenshot 1 there</span></label><textarea id="fBody" rows="10">${esc(e.body)}</textarea>
      <label>Tags (comma separated)</label><input id="fTags" style="width:100%" value="${esc(e.tags.join(", "))}">
      <label>Checklist</label>${e.checklist.map((c, i) => `<div class="check"><input type="text" data-ci="${i}" value="${esc(c.text)}"><button data-cdel="${i}" class="danger">✕</button></div>`).join("")}
      <div class="check"><input type="text" id="fNewItem" placeholder="Add an item and press Enter"><button id="fAddItem">Add</button></div>
      <label>Screenshots</label><div class="toolbar">${e.screenshots.map((s, i) => `<div class="shot"><img src="${media(s.thumb || s.file)}">Screenshot ${i + 1} <button data-sdel="${i}" class="danger">✕</button></div>`).join("")}</div>
      <input type="file" id="fShots" accept="image/*" multiple>
      <label>Voice recordings</label>${e.recordings.map((r, i) => `<div class="toolbar"><audio controls preload="none" src="${media(r.file)}"></audio><button data-rdel="${i}" class="danger">✕</button></div>`).join("")}
      <input type="file" id="fAudio" accept="audio/*">
      <label><input type="checkbox" id="fSpoiler" ${e.spoiler ? "checked" : ""}> Spoiler: hide it until people choose to reveal</label>
      <input id="fSpoilerLabel" class="${e.spoiler ? "" : "hidden"}" style="width:100%" placeholder="Spoils what? e.g. Beat the first boss" value="${esc(e.spoilerLabel)}">
      ${canAdmin ? `<label>Who can edit</label>
        <select id="fPolicy" style="width:100%"><option value="owner">Only me</option><option value="select">Me and people I choose</option><option value="anyone">Anyone signed in</option></select>
        <div id="fEditors" class="${e.editPolicy === "select" ? "" : "hidden"}">
          ${e.editors.map((u, i) => `<span class="chip">${who(u)} <a href="#" data-edel="${i}">✕</a></span>`).join("")}
          <div class="toolbar"><input id="fUserQ" placeholder="Find people by Steam name…"><button id="fUserFind">Find</button></div><div id="fUserResults"></div>
        </div>
        <label><input type="checkbox" id="fCopy" ${e.allowCopy ? "checked" : ""}> Let people copy this into their own notes (their copy is private to them)</label>` : ""}
      <div class="toolbar" style="margin-top:16px"><button class="primary" id="fSave">${isNew ? "Publish" : "Save"}</button><button id="fCancel">Cancel</button></div>`;
    $("#fKind", d).value = e.kind;
    if ($("#fPolicy", d)) $("#fPolicy", d).value = e.editPolicy;
    wire();
  };
  const collect = () => {
    if (isNew) { e.gameName = $("#fGame", d).value.trim(); e.appId = $("#fApp", d).value.replace(/\D/g, ""); }
    e.title = $("#fTitle", d).value; e.body = $("#fBody", d).value; e.kind = $("#fKind", d).value;
    e.tags = $("#fTags", d).value.split(",").map((t) => t.trim().replace(/^#/, "")).filter(Boolean);
    d.querySelectorAll("[data-ci]").forEach((el) => (e.checklist[el.dataset.ci].text = el.value));
    e.spoiler = $("#fSpoiler", d).checked; e.spoilerLabel = $("#fSpoilerLabel", d).value;
    if ($("#fPolicy", d)) { e.editPolicy = $("#fPolicy", d).value; e.allowCopy = $("#fCopy", d).checked; }
  };
  const wire = () => {
    $("#fCancel", d).onclick = () => d.close();
    $("#fSpoiler", d).onchange = (ev) => $("#fSpoilerLabel", d).classList.toggle("hidden", !ev.target.checked);
    if ($("#fPolicy", d)) $("#fPolicy", d).onchange = (ev) => $("#fEditors", d).classList.toggle("hidden", ev.target.value !== "select");
    const add = () => { collect(); const t = $("#fNewItem", d).value.trim(); if (!t) return; e.checklist.push({ id: uid(), text: t }); draw(); $("#fNewItem", d).focus(); };
    $("#fAddItem", d).onclick = add;
    $("#fNewItem", d).onkeydown = (ev) => { if (ev.key === "Enter") { ev.preventDefault(); add(); } };
    d.querySelectorAll("[data-cdel]").forEach((b) => (b.onclick = () => { collect(); e.checklist.splice(+b.dataset.cdel, 1); draw(); }));
    d.querySelectorAll("[data-sdel]").forEach((b) => (b.onclick = () => { collect(); e.screenshots.splice(+b.dataset.sdel, 1); draw(); }));
    d.querySelectorAll("[data-rdel]").forEach((b) => (b.onclick = () => { collect(); e.recordings.splice(+b.dataset.rdel, 1); draw(); }));
    d.querySelectorAll("[data-edel]").forEach((a) => (a.onclick = (ev) => { ev.preventDefault(); collect(); e.editors.splice(+a.dataset.edel, 1); draw(); }));
    $("#fShots", d).onchange = async (ev) => {
      collect();
      for (const f of ev.target.files) {
        const ext = (f.name.split(".").pop() || "jpg").toLowerCase();
        e.screenshots.push({ id: uid(), file: await upload(f, ext) });
      }
      draw();
    };
    $("#fAudio", d).onchange = async (ev) => {
      collect();
      for (const f of ev.target.files) e.recordings.push({ id: uid(), file: await upload(f, (f.name.split(".").pop() || "webm").toLowerCase()) });
      draw();
    };
    if ($("#fUserFind", d)) $("#fUserFind", d).onclick = async () => {
      const users = await api(`/api/users?q=${encodeURIComponent($("#fUserQ", d).value)}`);
      $("#fUserResults", d).innerHTML = users.filter((u) => u.steamId !== me.steamId).map((u) => `<div class="toolbar">${who(u)} <button data-addu='${esc(JSON.stringify(u))}'>Add</button></div>`).join("") || '<p class="meta">No one found. They need to sign in to the Bookstore once.</p>';
      d.querySelectorAll("[data-addu]").forEach((b) => (b.onclick = () => { collect(); const u = JSON.parse(b.dataset.addu); if (!e.editors.some((x) => x.steamId === u.steamId)) e.editors.push(u); draw(); }));
    };
    $("#fSave", d).onclick = async () => {
      collect();
      const payload = { title: e.title, body: e.body, kind: e.kind, tags: e.tags, checklist: e.checklist, screenshots: e.screenshots, recordings: e.recordings,
        spoiler: e.spoiler, spoilerLabel: e.spoilerLabel, editPolicy: e.editPolicy, editors: e.editors.map((u) => u.steamId), allowCopy: e.allowCopy };
      try {
        const saved = isNew ? await api("/api/entries", { method: "POST", json: { ...payload, appId: e.appId, gameName: e.gameName } })
          : await api(`/api/entries/${orig.id}`, { method: "PUT", json: payload });
        d.close();
        if (isNew) await openGame(saved.appId, saved.gameName); else refreshView();
        openEntry(saved.id);
        if (isNew && saved.status === "pending") alert("Thanks! An admin will check your post before everyone can see it.");
      } catch (err) { alert(err.message); }
    };
  };
  draw();
  d.showModal();
}

          <div class="quote">${r.exists ? esc(r.text || "") : '<i class="meta">already removed</i>'}</div>
          <div class="meta">${r.author ? "by " + who(r.author) + " · " : ""}reported by ${who(r.reporter)} ${ago(r.createdAt)}${r.reason ? ` · “${esc(r.reason)}”` : ""}${r.resolvedBy ? ` · ${esc(r.status)} by ${esc(r.resolvedBy.name)}` : ""}</div></div>
        ${r.status === "open" ? `<div class="acts"><button class="danger" data-rremove="${esc(r.id)}">Remove ${r.kind === "entry" ? "post" : "comment"}</button><button data-rdismiss="${esc(r.id)}">Dismiss</button>${r.author ? `<button data-ruser="${esc(r.author.steamId)}">👤 User</button>` : ""}</div>` : ""}</div>`).join("") || '<p class="meta">No reports here.</p>'}`;
  } else if (p === "comments") {
    const list = await api(`/api/admin/comments?q=${encodeURIComponent(adm.q)}`);
    html = `<h2>Comments</h2><div class="toolbar"><input id="admQ" placeholder="Search comments…" style="flex:1" value="${esc(adm.q)}"></div>
      ${list.map((cm) => `<div class="arow"><div class="text"><div class="meta">${who(cm.author)} on <a href="#" data-open="${esc(cm.entryId)}">${esc(cm.entryTitle || "(deleted post)")}</a> · ${esc(cm.gameName || "")} · ${date(cm.createdAt)} ${cm.reports ? `<span class="chip redchip">🚩 ${cm.reports}</span>` : ""}</div><div class="quote">${esc(cm.text)}</div></div>
        <div class="acts"><button class="danger" data-cdel="${esc(cm.id)}">Delete</button></div></div>`).join("") || '<p class="meta">No comments.</p>'}`;
  } else if (p === "games") {
    const list = await api("/api/admin/games");
    html = `<h2>Games</h2><p class="meta">Fix a game's name, or move its posts to the right Steam app ID if someone typed the wrong one.</p>
      ${list.map((g) => `<div class="arow"><img class="gart" src="${art(g.appId)}" onerror="this.style.visibility='hidden'"><div class="text"><b>${esc(g.names[0] || g.appId)}</b>${g.names.length > 1 ? ` <span class="chip">also: ${esc(g.names.slice(1).join(", "))}</span>` : ""}
          <div class="meta">App ${esc(g.appId)} · ${g.count} posts · ♥ ${g.likes} · updated ${ago(g.updatedAt)}</div></div>
        <div class="acts"><button data-grename="${esc(g.appId)}" data-name="${esc(g.names[0] || "")}">✏️ Rename</button><button data-gmove="${esc(g.appId)}">↪ Move posts</button><button data-gview="${esc(g.appId)}" data-name="${esc(g.names[0] || "")}">Open</button></div></div>`).join("") || '<p class="meta">No games yet.</p>'}`;
  } else if (p === "users") {
    const list = await api(`/api/admin/users?${new URLSearchParams({ q: adm.q, filter: adm.filter, sort: adm.sort })}`);
    html = `<h2>Users</h2><p class="meta">Everyone who has signed in with Steam at least once.</p>
      <div class="toolbar"><input id="admQ" placeholder="Search name or Steam ID…" style="flex:1" value="${esc(adm.q)}">
        <select id="admFilter"><option value="">Everyone</option><option value="banned">Banned</option><option value="admins">Admins</option></select>
        <select id="admSort"><option value="">Newest</option><option value="login">Last sign-in</option><option value="posts">Most posts</option><option value="name">Name</option></select></div>
      ${list.map((u) => `<details class="ucard" ${adm.openUser === u.steamId ? "open" : ""} data-user="${esc(u.steamId)}"><summary>${u.avatar ? `<img src="${esc(u.avatar)}">` : '<div class="ph"></div>'}
          <div class="text"><b>${esc(u.name)}</b> ${u.role ? `<span class="chip">🛡 admin${u.envAdmin ? " (owner)" : ""}</span>` : ""}${u.banned ? '<span class="chip redchip">⛔ banned</span>' : ""}
          <div class="meta">${u.posts} posts · ${u.comments} comments · ${u.devices} Decks · joined ${day(u.createdAt)} · last sign-in ${ago(u.lastLogin)}</div>${u.banReason ? `<div class="meta">Ban reason: ${esc(u.banReason)}</div>` : ""}</div></summary>
        <div class="uactions">${u.steamId === me.steamId ? '<p class="meta">This is you.</p>' : `
          <div class="toolbar"><span class="meta">See</span><button data-uposts="${esc(u.steamId)}" data-name="${esc(u.name)}">📚 Their posts</button><a href="https://steamcommunity.com/profiles/${esc(u.steamId)}" target="_blank" rel="noopener"><button>Steam profile</button></a></div>
          ${ownerAdmin && !u.envAdmin ? `<div class="toolbar"><span class="meta">Role</span><label class="inline"><input type="checkbox" data-uadmin="${esc(u.steamId)}" ${u.role ? "checked" : ""}> 🛡 Admin (can moderate everything)</label></div>` : ""}
          ${u.envAdmin || (u.role && !ownerAdmin) ? '<p class="meta">Only site owners can change another admin.</p>' : `
          <div class="toolbar"><span class="meta">Account</span>${u.banned ? `<button class="primary" data-uunban="${esc(u.steamId)}">Unban</button>` : `<button class="danger" data-uban="${esc(u.steamId)}">⛔ Ban</button>`}<button data-usignout="${esc(u.steamId)}">🚪 Sign out & unlink Decks</button></div>
          <div class="toolbar"><span class="meta">Clean up</span><button class="danger" data-upurge="posts" data-id="${esc(u.steamId)}">Delete all posts</button><button class="danger" data-upurge="comments" data-id="${esc(u.steamId)}">Delete all comments</button></div>`}`}</div></details>`).join("") || '<p class="meta">No one matches.</p>'}`;
  } else if (p === "general" || p === "rules") {
    const st = await api("/api/admin/settings");
    html = p === "general" ? `<h2>Announcement & mode</h2>
      <label>Announcement <span class="meta">— shown at the top of every page. Leave empty to hide it.</span></label><textarea id="sAnn" rows="3" maxlength="2000">${esc(st.announcement)}</textarea>
      <div class="toolbar"><button class="primary" id="sSaveAnn">Save announcement</button></div>
      <h4>Mode</h4>
      <label class="radio"><input type="checkbox" data-set="readOnly" ${st.readOnly ? "checked" : ""}><span><b>🔒 Read-only</b><br><span class="meta">Everyone can still browse and save posts, but only admins can post, edit or comment. Handy during a cleanup.</span></span></label>
      <label class="radio"><input type="checkbox" data-set="commentsEnabled" ${st.commentsEnabled ? "checked" : ""}><span><b>💬 Comments</b><br><span class="meta">Turn off to close comments everywhere (existing ones stay visible).</span></span></label>`
    : `<h2>Posting rules</h2><p class="meta">Admins skip all of these.</p>
      <label class="radio"><input type="checkbox" data-set="approvePosts" ${st.approvePosts ? "checked" : ""}><span><b>⏳ Check new posts first</b><br><span class="meta">New posts wait in the Approval queue until an admin publishes them. The poster can still see theirs.</span></span></label>
      <div class="row"><div><label>Posts per person per day (0 = no limit)</label><input id="sMax" type="number" min="0" value="${st.maxPostsPerDay}" style="width:100%"></div>
        <div><label>Days before new accounts can post or comment</label><input id="sDays" type="number" min="0" value="${st.minAccountDays}" style="width:100%"></div></div>
      <label>Blocked words <span class="meta">— comma or line separated; posts and comments containing one are refused</span></label><textarea id="sWords" rows="4">${esc(st.blockedWords)}</textarea>
      <div class="toolbar"><button class="primary" id="sSaveRules">Save rules</button></div>`;
  }
  const nav = ADMIN_PAGES.map(([g, pages]) => `<div class="agroup">${g}</div>` + pages.map(([id, icon, label]) => {
    const n = id === "queue" ? badges.pendingPosts : id === "reports" ? badges.openReports : 0;
    return `<button data-go="${id}" class="${id === p ? "active" : ""}">${icon} ${label}${n ? `<span class="badge">${n}</span>` : ""}</button>`;
  }).join("")).join("");
  $("#main").innerHTML = `<div class="admin"><div class="aside"><div class="ahead">🛡 Admin</div>${nav}</div><div class="apage">${html}</div></div>`;
  const m = $("#main"), on = (sel, fn) => m.querySelectorAll(sel).forEach(fn), enc = encodeURIComponent;
  on("[data-go]", (b) => (b.onclick = (e) => { e.preventDefault(); adm.q = adm.status = adm.flag = adm.sort = adm.filter = adm.author = ""; adm.selected.clear(); adminPage(b.dataset.go); }));
  on("[data-open]", (el) => (el.onclick = (e) => { e.preventDefault(); openEntry(el.dataset.open).catch((err) => alert(err.message)); }));
  const bindSel = (id, key) => { const el = $(id, m); if (el) { el.value = adm[key]; el.onchange = () => { adm[key] = el.value; adminPage(); }; } };
  bindSel("#admStatus", "status"); bindSel("#admFlag", "flag"); bindSel("#admSort", "sort"); bindSel("#admFilter", "filter"); bindSel("#admRStatus", "reportStatus");
  if ($("#clearAuthor", m)) $("#clearAuthor", m).onclick = (e) => { e.preventDefault(); adm.author = ""; adminPage(); };
  if ($("#admQ", m)) $("#admQ", m).onchange = (e) => { adm.q = e.target.value; adminPage(); };
  // posts
  on("[data-sel]", (c) => (c.onchange = () => { c.checked ? adm.selected.add(c.dataset.sel) : adm.selected.delete(c.dataset.sel); $(".bulk .meta", m).textContent = `${adm.selected.size} selected`; }));
  if ($("#selAll", m)) $("#selAll", m).onchange = (e) => on("[data-sel]", (c) => { c.checked = e.target.checked; c.onchange(); });
  on("[data-bulk]", (b) => (b.onclick = () => {
    if (!adm.selected.size) return alert("Tick some posts first.");
    if (b.dataset.bulk === "delete" && !confirm(`Delete ${adm.selected.size} posts for everyone?`)) return;
    act(() => aPost("entries/bulk", { ids: [...adm.selected], action: b.dataset.bulk }).then(() => adm.selected.clear()));
  }));
  on("[data-one]", (b) => (b.onclick = () => { if (b.dataset.one === "delete" && !confirm("Delete this post for everyone?")) return; act(() => aPost("entries/bulk", { ids: [b.dataset.id], action: b.dataset.one })); }));
  // reports & comments
  on("[data-rremove]", (b) => (b.onclick = () => confirm("Remove it for everyone?") && act(() => aPost(`reports/${enc(b.dataset.rremove)}/remove`))));
  on("[data-rdismiss]", (b) => (b.onclick = () => act(() => aPost(`reports/${enc(b.dataset.rdismiss)}`, { status: "dismissed" }))));
  on("[data-ruser]", (b) => (b.onclick = () => { adm.q = b.dataset.ruser; adm.openUser = b.dataset.ruser; adminPage("users"); }));
  on("[data-cdel]", (b) => (b.onclick = () => confirm("Delete this comment?") && act(() => api(`/api/comments/${enc(b.dataset.cdel)}`, { method: "DELETE" }))));
  // games
  on("[data-grename]", (b) => (b.onclick = () => { const n = prompt("Game name:", b.dataset.name); if (n) act(() => aPost(`games/${enc(b.dataset.grename)}`, { name: n })); }));
  on("[data-gmove]", (b) => (b.onclick = () => { const to = prompt(`Move every post of app ${b.dataset.gmove} to which Steam app ID?`); if (to) act(() => aPost(`games/${enc(b.dataset.gmove)}/move`, { to })); }));
  on("[data-gview]", (b) => (b.onclick = () => openGame(b.dataset.gview, b.dataset.name)));
  // users
  on("details.ucard", (d) => (d.ontoggle = () => { if (d.open) adm.openUser = d.dataset.user; }));
  on("[data-uposts]", (b) => (b.onclick = () => { adm.q = adm.status = adm.flag = adm.sort = ""; adm.author = b.dataset.uposts; adm.authorName = b.dataset.name; adminPage("posts"); }));
  on("[data-uadmin]", (c) => (c.onchange = () => { if (!confirm(c.checked ? "Make this person an admin? They can hide, delete and ban." : "Remove their admin rights?")) { c.checked = !c.checked; return; } act(() => aPost(`users/${enc(c.dataset.uadmin)}`, { role: c.checked ? "admin" : "" })); }));
  on("[data-uban]", (b) => (b.onclick = () => { const reason = prompt("Ban this person? They're signed out and can't post, comment or like. Reason (optional, only admins see it):"); if (reason !== null) act(() => aPost(`users/${enc(b.dataset.uban)}`, { banned: true, reason })); }));
  on("[data-uunban]", (b) => (b.onclick = () => act(() => aPost(`users/${enc(b.dataset.uunban)}`, { banned: false }))));
  on("[data-usignout]", (b) => (b.onclick = () => confirm("Sign them out and unlink their Decks?") && act(() => aPost(`users/${enc(b.dataset.usignout)}/signout`))));
  on("[data-upurge]", (b) => (b.onclick = () => confirm(`Delete ALL ${b.dataset.upurge} by this person? This can't be undone.`) && act(async () => { const r = await aPost(`users/${enc(b.dataset.id)}/purge`, { what: b.dataset.upurge }); alert(`Deleted ${r.posts} posts and ${r.comments} comments.`); })));
  // settings
  on("[data-set]", (c) => (c.onchange = () => act(async () => { await aPost("settings", { [c.dataset.set]: c.checked }); await loadMe(); })));
  if ($("#sSaveAnn", m)) $("#sSaveAnn", m).onclick = () => act(async () => { await aPost("settings", { announcement: $("#sAnn", m).value }); await loadMe(); });
  if ($("#sSaveRules", m)) $("#sSaveRules", m).onclick = () => act(() => aPost("settings", { maxPostsPerDay: +$("#sMax", m).value || 0, minAccountDays: +$("#sDays", m).value || 0, blockedWords: $("#sWords", m).value }));
}

async function refreshBadge() {
  const r = await api("/api/me");
  badges = { openReports: r.openReports || 0, pendingPosts: r.pendingPosts || 0 };
  siteInfo = r.site || {};
  paintHeader();
}

function report(kind, id) {
  if (!me) return (location.href = signIn());
  const reason = prompt(`Report this ${kind === "entry" ? "post" : "comment"} to the admins. What's wrong with it?`);
  if (reason === null) return;
  api("/api/report", { method: "POST", json: { kind, id, reason } }).then(() => alert("Thanks, the admins will take a look.")).catch((err) => alert(err.message));
}

$("#home").onclick = () => home();
$("#gameSearch").onchange = (e) => home(e.target.value.trim());
/** Android back button (Session Notes app): close the top dialog if one is open. */
window.snBack = () => {
  for (const d of [$("#dlg2"), $("#dlg")]) if (d.open) { d.close(); return true; }
  return false;
};
start();
</script>
</body>
</html>
